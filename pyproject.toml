[project]
name = "fraud-arena"
version = "0.1.0"
description = "Fraud Arena: benchmarks of agents that build and run fraud detection in Fraud World"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3",
  "pyyaml>=6",
  "pyarrow>=15",
  "duckdb>=1.1",
]

[project.optional-dependencies]
sandbox = ["scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.3", "pandas>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
fraud-arena = "fraud_arena.cli:main"
fa-grayson = "fraud_arena.grayson:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fraud_arena*"]

[tool.setuptools.package-data]
fraud_arena = ["briefs/*.md"]
