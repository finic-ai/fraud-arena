# Fraud Arena 1v1 variant of runmere spec/examples/payments-ato-mini.world.yaml: see docs/1v1.md.
# A small fictional payments world: one observed bank, background institutions, everyday card spend, payroll,
# logins, attrition after friction, transaction monitoring with an analyst queue, and one fraud scenario (account
# takeover) with its look-alikes. It is the first version of the R2 world (docs/design/11-payments-domain.md).
# Every number is a placeholder with evidence `assumed`, or none.

runmere: "0.1"
id: payments-ato-mini
description: Small fictional payments world with one account-takeover scenario.

clock:
  epoch: "2025-01-01T00:00:00Z"
  step: 1m
  plan_period: 1d
  calendar: us_federal_reserve
  default_time_zone: America/Chicago

vocab:
  code_lists:
    merchant_category:
      values: [grocery, restaurant, fuel, online_retail, electronics, travel, subscription, gift_cards]
    branch:
      values: [central, north, south, east, west, mall, airport, downtown]

world:
  currency: USD

  params:
    # Calibrated (R6) against the public card targets; the fit report is
    # crates/runmere-py/examples/results/calibration_payments_public.json. The values before were spend_shape 1.6,
    # spend_scale 18, login_rate 12, everyday_amount_mu 3.4, other_amount_mu 4.3, amount_sigma 0.7 and
    # store_merchant_online_share 0. churn_after_friction and web_merchant_online_share keep their values: no target
    # constrains them.
    spend_shape:
      value: 1.672
      free: true
      bounds: [0.5, 5.0]
      evidence: {method: estimated, source: "R6 calibration against the public card targets", as_of: "2026-11-06",
                 confidence: medium}
    spend_scale:
      value: 22.37
      free: true
      bounds: [5, 60]
      description: Card purchases per month for a person with spend_level 1.
      evidence: {method: estimated, source: "R6 calibration against the public card targets", as_of: "2026-11-06",
                 confidence: medium}
    login_rate:
      value: 14.24
      free: true
      bounds: [2, 40]
      evidence: {method: estimated, source: "R6 calibration against the public card targets", as_of: "2026-11-06",
                 confidence: medium}
    churn_after_friction: {value: 0.01, free: true, bounds: [0.0, 0.05], evidence: {method: assumed}}
    travel_rate: {value: 3, evidence: {method: assumed, notes: "Trips with a login away from home, per person per year"}}
    ato_rate:
      value: 0.092
      description: Takeover attempts per person per year, before trait odds and campaign waves.
      evidence:
        method: estimated
        source: >-
          Javelin Strategy & Research, 2026 Identity Fraud Study (April 2026): 6 million US consumers lost an account
          to a takeover in 2025, against 267.0 million adults (US Census Bureau, Vintage 2024: 340.1 million people,
          73.1 million under 18), so 2.25% a year. A year of this world (seed 900) at 0.1 had 134 takeovers among
          5,447 persons (2.46%); 0.092 scales that to 2.25%.
        as_of: "2026-11-07"
        confidence: low
        notes: >-
          Javelin's takeovers cover every kind of financial account, and this world's cover one bank's online banking.
          Before R8's calibration the value was 0.004 (assumed), 25 times too few takeovers.
    # Purchase amounts and the online share, free for calibration against the public card targets (R6).
    everyday_amount_mu:
      value: 2.717
      free: true
      bounds: [2.5, 4.5]
      description: Log-scale center of a purchase at grocery, restaurant, fuel and subscription merchants.
      evidence: {method: estimated, source: "R6 calibration against the public card targets", as_of: "2026-11-06",
                 confidence: medium}
    other_amount_mu:
      value: 4.51
      free: true
      bounds: [3.0, 5.5]
      description: Log-scale center of a purchase at the other merchants.
      evidence: {method: estimated, source: "R6 calibration against the public card targets", as_of: "2026-11-06",
                 confidence: medium}
    amount_sigma:
      value: 0.55
      free: true
      bounds: [0.3, 1.2]
      description: Log-scale spread of a purchase at any merchant.
      evidence: {method: estimated, source: "R6 calibration against the public card targets", as_of: "2026-11-06",
                 confidence: medium}
    web_merchant_online_share:
      value: 1.0
      free: true
      bounds: [0.5, 1.0]
      description: Share of everyday purchases made online at online retail, subscription and gift card merchants.
      evidence: {method: assumed}
    store_merchant_online_share:
      value: 0.134
      free: true
      bounds: [0.0, 0.4]
      description: Share of everyday purchases made online at the other merchants, such as online grocery orders.
      evidence: {method: estimated, source: "R6 calibration against the public card targets", as_of: "2026-11-06",
                 confidence: medium}
    ato_stealth:
      value: 0.0
      bounds: [0.0, 1.5]
      description: Difficulty. Lowers cash-out amounts on the log scale, the drain's share of the balance too.
    ato_drain:
      value: 0.5
      bounds: [0.0, 1.0]
      description: >-
        The share of scripted cash-outs that drain the victim's checking account by P2P to a mule account, in place of
        a card purchase.
      evidence:
        method: estimated
        source: >-
          Javelin Strategy & Research, 2026 Identity Fraud Study: takeover losses of more than $15 billion over 6
          million victims in 2025, more than $2,500 a victim. With the bank's rules and the script, 0.5 gives $2,623
          per takeover (145 takeovers in 600 `auth_vs_adversary` episodes, validation seeds), 0.45 gives $2,303, and
          no drain $1,156.
        as_of: "2026-11-07"
        confidence: low
    p2p_limit:
      value: 2500
      description: The most that one P2P payment out of an account can move, as banks limit P2P payments.
      evidence: {method: assumed, notes: "R8: a common size of a bank's P2P limit; banks set their own"}
    ato_stealth_route:
      value: 0.0
      bounds: [0.0, 1.0]
      description: >-
        Difficulty. The share of scripted attacks that take the stealth route: phished credentials, a phone-farm
        device and a residential proxy, which the vendors score as a customer's own.
    ato_blend:
      value: 0.0
      bounds: [0.0, 1.0]
      description: >-
        Difficulty. The share of scripted cash-outs that the fraudster makes as the victim would: at one of the
        victim's own shops, at the victim's amounts there, online or in the shop as the victim buys there. In a shop,
        a mule pays with the card in a phone wallet. The other cash-outs buy electronics and gift cards online. It
        also moves a drain's payments toward the size of the victim's own P2P payments.
    wallet_tap_share:
      value: 0.15
      bounds: [0.0, 0.6]
      description: The mean share of a customer's purchases in shops that the customer pays with a phone wallet.
      evidence: {method: assumed, notes: "R8 look-alike for the wallet purchases of account takeovers"}
    vpn_share:
      value: 0.1
      bounds: [0.0, 0.5]
      description: The share of customers whose online traffic leaves through a VPN, from a data-center IP.
      evidence: {method: assumed, notes: "R8 look-alike for the data-center IPs of account takeovers"}
    risky_device_share:
      value: 0.05
      bounds: [0.0, 0.3]
      description: The share of customers' own devices that a device vendor scores as risky (rooted, old, shared).
      evidence: {method: assumed, notes: "R8 look-alike for the emulators of account takeovers"}
    ato_notice_rate:
      value: 1.5
      bounds: [0.0, 5.0]
      description: >-
        Per day, how often a victim who still gets the bank's messages notices a cash-out and stops it. A fraudster
        who changes the victim's email removes this risk.
      evidence: {method: assumed, notes: "R7 adversary trade-off; no public target"}
    p2p_rate:
      value: 4.0
      bounds: [0.5, 20.0]
      description: P2P payments to contacts per month for a person with digital_habit 1.
      evidence: {method: assumed, notes: "R8: no public target for P2P payments per person yet"}
    seller_share: {value: 0.05, bounds: [0.0, 0.2], description: "The share of persons who sell things online for P2P payments.", evidence: {method: assumed}}
    rent_p2p_share: {value: 0.1, bounds: [0.0, 0.4], description: "The share of persons who pay their rent by P2P each month.", evidence: {method: assumed}}
    crypto_share: {value: 0.04, bounds: [0.0, 0.2], description: "The share of persons who buy crypto by wire.", evidence: {method: assumed}}
    scam_rate:
      value: 0.003
      description: Authorized push payment scams per person per year, before trait odds.
      evidence: {method: assumed, notes: "R8"}
    mule_rate:
      value: 0.002
      description: Money mule recruitments per person per year, before trait odds.
      evidence: {method: assumed, notes: "R8"}
    mule_cut: {value: 0.1, bounds: [0.0, 0.3], description: "The share of each receipt that a mule keeps.", evidence: {method: assumed}}
    scam_small:
      value: 0.0
      bounds: [0.0, 2.0]
      description: Difficulty. Lowers what a scammer asks for at each payment, on the log scale.
    mule_small:
      value: 0.0
      bounds: [0.0, 1.5]
      description: Difficulty. Lowers what victims send a mule at each payment, on the log scale.
    mule_p2p:
      value: 0.0
      bounds: [0.0, 1.0]
      description: >-
        Difficulty. The share of a mule's receipts that the mule sends on by P2P to the handler's next account, in
        place of a wire to an exchange.
    # The rest of the fraud library (R8, doc 11): card testing, synthetic identities, first-party fraud, structuring,
    # merchant bust-out, elder financial abuse and laundering.
    card_compromise_rate:
      value: 0.027
      description: Card compromises per active card per year, before the card's odds and breach waves.
      evidence:
        method: estimated
        source: >-
          Federal Reserve Board, 2023 Interchange Fee Revenue, Covered Issuer Costs, and Covered Issuer and Merchant
          Fraud Losses Related to Debit Card Transactions (December 2025), table 10: 0.108% of debit card purchases
          were fraudulent in 2023, at $78 each on average. A year of this world (seeds 900 and 901): card testing and
          takeover purchases were 0.110% and 0.106% of approved card payments, at $74 and $84 each.
        as_of: "2026-11-07"
        confidence: medium
        notes: >-
          Covered issuers' debit cards there; every bank's cards here. The Bureau of Justice Statistics (Victims of
          Identity Theft, 2021, October 2023) found that almost 4% of persons aged 16 or more had a credit card misused
          in a year, and 3% a bank account; here 4.5% of persons get a card compromise label in a year.
    card_test_stealth:
      value: 0.0
      bounds: [0.0, 1.0]
      description: >-
        Difficulty. The share of testing crews that test a card as a subscription would charge it and cash out at the
        holder's own kinds of shops, at the holder's amounts.
    card_skim_share:
      value: 0.457
      bounds: [0.0, 1.0]
      description: >-
        The share of compromised cards that were skimmed, so that a counterfeit card works in shops. The others are
        cashed out online.
      evidence:
        method: documented
        source: >-
          Federal Reserve Board, 2023 Interchange Fee Revenue, Covered Issuer Costs, and Covered Issuer and Merchant
          Fraud Losses Related to Debit Card Transactions (December 2025): card-not-present fraud was 54.3% of debit card
          fraud losses in 2023, so card-present fraud was 45.7%.
        as_of: "2023"
        confidence: medium
        notes: By value, on covered issuers' debit cards. Here a share of cases, which cash out by count.
    card_test_proxy:
      value: 0.0
      bounds: [0.0, 1.0]
      description: Difficulty. The share of testing crews that work through residential proxies in place of data centers.
    verification_rate:
      value: 0.4
      bounds: [0.0, 3.0]
      description: Small card charges (verifications, app stores, parking) per month for a person with digital_habit 1.
      evidence: {method: assumed, notes: "R8 look-alike for card testing"}
    synthetic_share:
      value: 0.0043
      bounds: [0.0, 0.05]
      description: The share of households that a ring made up, each with one synthetic person.
      evidence:
        method: estimated
        source: >-
          TransUnion, as reported by Digital Transactions (October 2024): 0.20% of the accounts opened in the first half
          of 2024 were tied to synthetic identities. With 2.17 persons in other households, 0.43% of households gives
          0.20% of persons (0.28% and 0.19% in seeds 900 and 901).
        as_of: "2026-11-07"
        confidence: low
        notes: New credit accounts there (bank cards, retail cards, auto and personal loans); the persons of a payments world here.
    bustout_rate:
      value: 0.8
      description: Bust-outs per synthetic person per year. A synthetic identity busts out once.
      evidence:
        method: assumed
        notes: >-
          The loss checks against public data: Equifax (press release, January 2026) puts the average charged-off loss
          per known synthetic identity at about $13,000; here a bust-out moves $12,173 and $14,290 out of the identity's
          accounts on average (7 and 9 cases in a year, seeds 900 and 901), the drawn line and the bad check.
    bustout_slow:
      value: 0.0
      bounds: [0.0, 1.0]
      description: >-
        Difficulty. Spreads a synthetic identity's bust-out over more days, at the identity's own shops and smaller
        amounts.
    synthetic_proxy:
      value: 0.0
      bounds: [0.0, 1.0]
      description: >-
        Difficulty. The share of synthetic identities that reach the bank through a residential proxy in place of a
        data-center IP.
    credit_line_share:
      value: 0.15
      bounds: [0.0, 0.5]
      description: The share of checking accounts with an overdraft line of credit.
      evidence: {method: assumed}
    check_income_rate:
      value: 0.5
      bounds: [0.0, 4.0]
      description: Paper checks that a person deposits per month (refunds, gifts, side work), before the person's habits.
      evidence: {method: assumed}
    bad_check_share:
      value: 0.005
      bounds: [0.0, 0.05]
      description: The share of honest check deposits that come back unpaid, such as a client's check that bounces.
      evidence: {method: assumed}
    check_fraud_rate:
      value: 0.002
      description: First-party check fraud cases per person per year, before trait odds and waves.
      evidence:
        method: assumed
        notes: >-
          No public rate of first-party check fraud was found. FinCEN's alert FIN-2023-Alert003 (February 2023) counts
          more than 680,000 suspicious activity reports on check fraud in 2022, most of it stolen, altered and
          counterfeit checks of other people.
    check_small:
      value: 0.0
      bounds: [0.0, 2.0]
      description: Difficulty. Lowers the bad check's amount on the log scale, and spreads the withdrawals.
    chargeback_rate:
      value: 0.05
      description: False chargeback schemes per person per year, before trait odds and waves.
      evidence:
        method: estimated
        source: >-
          Mastercard and Datos Insights, State of Chargebacks (2025), as summarized by Chargeback Gurus (June 2025):
          issuers put first-party fraud at 13% of disputes, and merchants at 21%. A year of this world (seeds 900 and
          901): false chargebacks were 19.0% and 14.9% of disputes.
        as_of: "2026-11-07"
        confidence: low
        notes: >-
          Global figures, from a vendor's summary of the report. The same summary has merchants winning 20% of the
          disputes they contest (Chargebacks911's 2024 field report: 18%); here merchants win 20.5% and 17.7% of
          disputes.
    chargeback_blend:
      value: 0.0
      bounds: [0.0, 1.0]
      description: >-
        Difficulty. The share of false chargebacks on a purchase like the person's own, at one of the person's shops,
        with the reasons and delays of honest disputes.
    dispute_share:
      value: 0.0012
      bounds: [0.0, 0.05]
      description: >-
        The share of a customer's approved online purchases that the customer disputes in good faith; in shops, 0.3
        times as many.
      evidence:
        method: estimated
        source: >-
          Consumer Financial Protection Bureau, Consumer Credit Card Market Report, 2025 (December 2025): cardholders
          disputed $9.8 billion of $3.6 trillion of credit card purchases in 2024, 0.27%. A year of this world (seeds
          900 and 901): disputes of every kind came to 0.288% and 0.271% of approved card payments by value.
        as_of: "2026-11-07"
        confidence: low
        notes: Credit cards there, debit cards here. Here the disputes include the victims' disputes of card fraud and false chargebacks.
    cash_earner_share:
      value: 0.08
      bounds: [0.0, 0.3]
      description: The share of persons paid partly in cash (tips, trades), who deposit it each week.
      evidence: {method: assumed}
    structuring_rate:
      value: 0.001
      description: Structuring cases per person per year, before trait odds and waves.
      evidence:
        method: assumed
        notes: >-
          FinCEN's Year in Review for fiscal 2025 counts 1.25 million suspicious activity reports with structuring among
          their activities, and 21.5 million currency transaction reports (31 CFR 1010.311: cash of more than $10,000).
          Reports count filings, often several for one customer, so they give no rate per person.
    structuring_small:
      value: 0.0
      bounds: [0.0, 2.7]
      description: >-
        Difficulty. Lowers each structured deposit on the log scale, away from the $10,000 threshold, and spreads the
        amounts. At 2.7 the deposits are about a cash earner's ($600), and there are more of them.
    structuring_spread:
      value: 0.0
      bounds: [0.0, 1.0]
      description: Difficulty. Spreads the deposits over more days and over the person's accounts.
    business_owner_share:
      value: 0.04
      bounds: [0.0, 0.2]
      description: The share of persons who own a small business that takes card payments.
      evidence: {method: assumed}
    merchant_bustout_rate:
      value: 0.01
      description: Merchant bust-outs per business per year, before the owner's odds and waves.
      evidence: {method: assumed, notes: "No public frequency or loss of merchant bust-outs was found."}
    bustout_ramp:
      value: 0.0
      bounds: [0.0, 1.0]
      description: Difficulty. Lowers how far a bust-out merchant's card sales rise, from 5 times to 1.5 times.
    bustout_drain:
      value: 0.0
      bounds: [0.0, 1.0]
      description: >-
        Difficulty. The share of a bust-out merchant's payouts made as its usual supplier payments, in place of one
        large draw by the owner.
    caregiver_share:
      value: 0.15
      bounds: [0.0, 0.5]
      description: The share of persons aged 70 or more who pay a caregiver each week.
      evidence: {method: assumed}
    elder_abuse_rate:
      value: 0.025
      description: Elder financial abuse cases per person aged 60 or more per year, before trait odds and waves.
      evidence:
        method: estimated
        source: >-
          Peterson et al., Financial Exploitation of Older Adults: A Population-Based Prevalence Study, Journal of
          General Internal Medicine (2014): a one-year prevalence of 2.7% among New Yorkers aged 60 or more. With the
          campaign waves (1.08 times the rate on average) the world's rate gives 2.7%; a year gave 2.4% and 2.2% (36 and
          32 cases, seeds 900 and 901).
        as_of: "2026-11-07"
        confidence: low
        notes: >-
          Acierno et al. (American Journal of Public Health, 2010) found 5.2% current financial abuse by a family member,
          nationally. A case here moves $9,760 and $9,535 on average out of the elder's account; FinCEN's elder theft
          reports (Financial Trend Analysis, April 2024) had a median of $23,762, and reports are written for the
          larger cases.
    elder_slow:
      value: 0.0
      bounds: [0.0, 1.0]
      description: Difficulty. Lowers what the abuser takes each time on the log scale, and takes it less often.
    laundering_rate:
      value: 0.001
      description: Laundering schemes per person per year, before trait odds and waves.
      evidence:
        method: assumed
        notes: >-
          The Treasury's 2015 National Money Laundering Risk Assessment puts illicit proceeds in the United States at
          about $300 billion a year; no rate of launderers per person was found. FinCEN's Year in Review for fiscal 2025
          counts 2 million suspicious activity reports with money laundering among their activities, 0.75% of 267
          million adults, but reports count filings, often several for one customer.
    laundering_small:
      value: 0.0
      bounds: [0.0, 1.5]
      description: >-
        Difficulty. Lowers each placement on the log scale, and at 1.5 moves money in the sizes of a person's own
        transfers and P2P payments.

  # Taint tracking (SPEC §6.5): each account keeps the dirty part of its balance, and every transfer moves dirt in
  # proportion. Money that a laundering scheme places is dirty, and a row whose event moves at least half dirty money
  # carries the `laundering` label in the data checks: the label follows the money, through the launderer's own
  # spending too (AMLworld's idea).
  taint: {label: laundering, min_share: 0.5}

  institutions:
    demo_bank: {kind: bank, market_share: 0.25}
    # A second observed bank (R8): it sees the other side of the P2P payments that reach its customers.
    metro_bank: {kind: bank, market_share: 0.15}
  background_institutions: {count: 12, kinds: {bank: 0.8, card_issuer: 0.2}, market_share: 0.60}

  entities:
    household:
      population: {count: 2500}
      attributes:
        region:
          type: code
          visibility: observable
          values: [midwest, northeast, south, west]
          shares: {midwest: 0.21, northeast: 0.17, south: 0.38, west: 0.24}
        synthetic:
          description: A household that a ring made up, with one synthetic person in it.
          type: bool
          visibility: hidden
          dist: bernoulli
          params: {p: params.synthetic_share}

    person:
      population:
        - {per: household, counts: {1: 0.28, 2: 0.42, "3-4": 0.30}, link: household, where: "not parent.synthetic"}
        # A synthetic identity: a real SSN with a made-up name, a thin file grown on borrowed tradelines, and the ring's
        # network in place of a home's.
        - per: household
          counts: {1: 1.0}
          link: household
          where: parent.synthetic
          attributes:
            synthetic: {expr: "true"}
            age: {quantiles: {p05: 22, p50: 29, p95: 41}}
            vpn_user: {expr: "true"}
            vpn_exit:
              pick: "entities('ip')"
              where: "it.kind in ('data_center', 'residential_proxy')"
              weight: "params.synthetic_proxy if it.kind == 'residential_proxy' else 1 - params.synthetic_proxy"
            business_owner: {expr: "false"}
      cluster: self.household
      profile: [name, date_of_birth, email, phone, address]
      segments:
        - id: young_digital
          share: 0.3
          attributes:
            age: {quantiles: {p05: 19, p50: 27, p95: 34}}
            digital_habit: {dist: beta, params: {a: 5, b: 2}}
        - id: established
          share: 0.5
        - id: retiree
          share: 0.2
          attributes:
            age: {quantiles: {p05: 66, p50: 72, p95: 86}}
            digital_habit: {dist: beta, params: {a: 2, b: 5}}
      attributes:
        household: {type: ref, visibility: observable, entity: household, inverse: members}
        age: {type: int, visibility: observable, quantiles: {p05: 24, p50: 45, p95: 64}}
        spend_level: {type: float, visibility: hidden, dist: lognormal, params: {mu: 0.0, sigma: 0.5}}
        digital_habit: {type: float, visibility: hidden, dist: beta, params: {a: 3, b: 3}}
        password_reuse: {type: float, visibility: hidden, dist: beta, params: {a: 2, b: 3}}
        income_monthly: {type: money, visibility: hidden, dist: lognormal, params: {mu: 8.2, sigma: 0.55}}
        status: {type: code, visibility: observable, values: [active, closed], expr: "'active'"}
        restricted: {type: bool, visibility: observable, expr: false}
        contact_hijacked: {type: bool, visibility: hidden, expr: false}
        taken_over: {type: bool, visibility: hidden, expr: false}
        stepped_up: {type: bool, visibility: observable, expr: false}
        vpn_user: {type: bool, visibility: hidden, dist: bernoulli, params: {p: params.vpn_share}}
        vpn_exit: {type: ref, visibility: hidden, entity: ip, pick: "entities('ip')", where: "it.kind == 'data_center'"}
        isolation: {type: float, visibility: hidden, dist: beta, params: {a: 2, b: 5}}
        financial_stress: {type: float, visibility: hidden, dist: beta, params: {a: 2, b: 4}}
        seller: {type: bool, visibility: hidden, dist: bernoulli, params: {p: params.seller_share}}
        crypto_user: {type: bool, visibility: hidden, dist: bernoulli, params: {p: params.crypto_share}}
        rent_by_p2p: {type: bool, visibility: hidden, dist: bernoulli, params: {p: params.rent_p2p_share}}
        rent: {type: money, visibility: hidden, dist: lognormal, params: {mu: "ln(900)", sigma: 0.4}, round: 0}
        synthetic: {type: bool, visibility: hidden, expr: false}
        busted: {type: bool, visibility: hidden, expr: false}
        mule_active: {type: bool, visibility: hidden, expr: false}
        home_branch: {type: code, visibility: hidden, code_list: branch, shares: {central: 0.2, north: 0.15, south: 0.15, east: 0.1, west: 0.1, mall: 0.1, airport: 0.05, downtown: 0.15}}
        cash_earner: {type: bool, visibility: hidden, dist: bernoulli, params: {p: params.cash_earner_share}}
        business_owner: {type: bool, visibility: hidden, dist: bernoulli, params: {p: params.business_owner_share}}
        has_caregiver:
          type: bool
          visibility: hidden
          dist: bernoulli
          params: {p: "params.caregiver_share if self.age >= 70 else 0.0"}
        caregiver: {type: ref, visibility: hidden, entity: counterparty, pick: "entities('counterparty')", where: "it.kind == 'person'"}
      joint:
        method: gaussian_copula
        correlations: {"spend_level~income_monthly": 0.6, "digital_habit~password_reuse": -0.2}

    account:
      population: {per: person, counts: {1: 0.62, 2: 0.38}, link: holder, where: "parent.age >= 18"}
      ledger: true
      opening_balance:
        dist: lognormal
        params: {mu: "7.3 if self.type == 'checking' else 8.3", sigma: 1.0}
        round: 2
        evidence: {method: assumed, notes: "Medians near 1,500 for checking and 4,000 for savings"}
      cluster: self.holder.household
      attributes:
        holder: {type: ref, visibility: observable, entity: person, inverse: accounts}
        institution:
          type: ref
          visibility: observable
          entity: institution
          pick: "entities('institution')"
          weight: "it.market_share * (1.6 if it == institution('demo_bank') and parent.age < 35 else 1.0)"
        type: {type: code, visibility: observable, values: [checking, savings], shares: {checking: 0.7, savings: 0.3}}
        status: {type: code, visibility: observable, values: [open, closed], expr: "'open'"}
        # An overdraft line of credit. A synthetic identity's borrowed tradelines get it a line, and a larger one.
        has_line:
          type: bool
          visibility: hidden
          dist: bernoulli
          params: {p: "(1.0 if parent.synthetic else params.credit_line_share) if self.type == 'checking' else 0.0"}
        line_size: {type: money, visibility: hidden, dist: lognormal, params: {mu: "ln(2500) if parent.synthetic else ln(800)", sigma: 0.5}, round: 0}
        credit_line: {type: money, visibility: observable, expr: "self.line_size if self.has_line else 0"}

    card:
      population: {per: account, counts: {1: 0.85, 2: 0.15}, link: account, where: "parent.type == 'checking'"}
      cluster: self.account.holder.household
      attributes:
        account: {type: ref, visibility: observable, entity: account, inverse: cards}
        holder: {type: ref, visibility: observable, entity: person, inverse: cards, expr: parent.holder}
        status: {type: code, visibility: observable, values: [active, blocked], expr: "'active'"}

    device:
      population:
        - {per: person, counts: {1: 0.55, 2: 0.4, 3: 0.05}, link: owner, attributes: {kind: {expr: "'own'"}}}
        - {count: 40, attributes: {kind: {expr: "'emulator'"}}}
        - {count: 40, attributes: {kind: {expr: "'farm'"}, platform: {shares: {ios: 0.5, android: 0.5}}}}
      attributes:
        owner: {type: ref, visibility: hidden, entity: person, inverse: devices}
        kind: {type: code, visibility: hidden, values: [own, emulator, farm]}
        risky:
          type: bool
          visibility: hidden
          dist: bernoulli
          params: {p: "params.risky_device_share if self.kind in ('own', 'farm') else 0.0"}
        platform:
          type: code
          visibility: observable
          values: [ios, android, web]
          shares: {ios: 0.45, android: 0.4, web: 0.15}

    ip:
      description: A network exit.
      population:
        - {per: household, counts: {1: 1.0}, link: household, attributes: {kind: {expr: "'household'"}}}
        - {count: 60, attributes: {kind: {expr: "'data_center'"}}}
        - {count: 60, attributes: {kind: {expr: "'residential_proxy'"}}}
      attributes:
        household: {type: ref, visibility: hidden, entity: household, inverse: networks}
        kind: {type: code, visibility: hidden, values: [household, data_center, residential_proxy]}

    merchant:
      population: {count: 400}
      ledger: true
      attributes:
        category:
          type: code
          visibility: observable
          code_list: merchant_category
          shares: {grocery: 0.2, restaurant: 0.25, fuel: 0.1, online_retail: 0.2, electronics: 0.05, travel: 0.05,
                   subscription: 0.1, gift_cards: 0.05}
        popularity: {type: float, visibility: hidden, dist: lognormal, params: {mu: 0.0, sigma: 1.0}}
        amount_mu:
          type: float
          visibility: hidden
          expr: >-
            params.everyday_amount_mu if self.category in ('grocery', 'restaurant', 'fuel', 'subscription')
            else params.other_amount_mu
        amount_sigma: {type: float, visibility: hidden, expr: params.amount_sigma}
        ecommerce_share:
          type: float
          visibility: hidden
          expr: >-
            params.web_merchant_online_share if self.category in ('online_retail', 'subscription', 'gift_cards')
            else params.store_merchant_online_share

    business:
      description: A small business that a person owns. Its card sales settle into its account at a bank each business day.
      population: {per: person, counts: {1: 1.0}, link: owner, where: "parent.business_owner and parent.age >= 21"}
      ledger: true
      opening_balance: {dist: lognormal, params: {mu: 9.0, sigma: 0.8}, round: 2}
      cluster: self.owner.household
      attributes:
        owner: {type: ref, visibility: observable, entity: person, inverse: businesses}
        institution: {type: ref, visibility: observable, entity: institution, pick: "entities('institution')", weight: it.market_share}
        kind:
          type: code
          visibility: observable
          values: [retail, restaurant, online, services]
          shares: {retail: 0.3, restaurant: 0.25, online: 0.2, services: 0.25}
        sales_daily: {type: money, visibility: hidden, dist: lognormal, params: {mu: "ln(900)", sigma: 0.9}, round: 2}
        chargeback_share:
          type: float
          visibility: hidden
          dist: lognormal
          params: {mu: "ln(0.012) if self.kind == 'online' else ln(0.004)", sigma: 0.5}
          evidence:
            method: assumed
            notes: >-
              Most honest businesses stay under the card networks' monitoring levels, such as Mastercard's 1.5% of
              transactions for an excessive chargeback merchant (as processors document it).
        status: {type: code, visibility: observable, values: [open, closed], expr: "'open'"}
        surging: {type: bool, visibility: hidden, expr: false}

    attack_kit:
      description: The tools that a fraudster set up for one attack. Only a takeover makes one.
      population: {created_by: effects}
      attributes:
        stealth: {type: bool, visibility: hidden, expr: false}
        wallet_card: {type: ref, visibility: hidden, entity: card}

    card_crew:
      description: How a card-testing crew works one compromised card. Only card testing makes one.
      population: {created_by: effects}
      attributes:
        stealth: {type: bool, visibility: hidden, expr: false}
        counterfeit: {type: bool, visibility: hidden, expr: false}

    claim_plan:
      description: How a buyer plans one false chargeback. Only a false chargeback makes one.
      population: {created_by: effects}
      attributes:
        stealth: {type: bool, visibility: hidden, expr: false}

    fraudster:
      population: {count: 15}
      attributes:
        skill: {type: float, visibility: hidden, dist: beta, params: {a: 2, b: 2}}

    counterparty:
      description: >-
        A person outside the world whom customers pay or who pays them by P2P: a contact at another bank, a stranger
        who sells or buys something, or a mule account that a scammer gives a victim.
      population:
        - {count: 1950, attributes: {kind: {expr: "'person'"}}}
        - {count: 50, attributes: {kind: {expr: "'mule'"}}}
      attributes:
        kind: {type: code, visibility: hidden, values: [person, mule]}
        popularity: {type: float, visibility: hidden, dist: lognormal, params: {mu: 0.0, sigma: 1.0}}

    mule_pool:
      description: >-
        The pool of mule accounts that scams pay (R8): each slot holds the account of a mule whom the mule scenario
        recruited, until the mule stops. A scam picks a filled slot, so it never scans the world's accounts.
      # One slot for about 500 households, so that the pool, like the mules, grows with the world.
      population: {per: household, counts: {0: 0.998, 1: 0.002}, link: household}
      cluster: self.household
      attributes:
        household: {type: ref, visibility: hidden, entity: household}
        account: {type: ref, visibility: hidden, entity: account}

    scam_plan:
      description: What a scammer tells one victim. Only a scam makes one.
      population: {created_by: effects}
      attributes:
        kind:
          type: code
          visibility: hidden
          values: [impersonation, romance, investment]
          shares: {impersonation: 0.5, romance: 0.2, investment: 0.3}
        paid: {type: int, visibility: hidden, expr: 0}

    alert:
      population: {created_by: effects}
      attributes:
        subject: {type: ref, visibility: observable, entity: person, inverse: alerts}
        reason: {type: code, visibility: observable, values: [txn_monitoring]}

    aml_alert:
      description: An alert of the bank's anti-money-laundering monitoring, reviewed by its financial crimes team.
      population: {created_by: effects}
      attributes:
        subject: {type: ref, visibility: observable, entity: person, inverse: aml_alerts}
        reason: {type: code, visibility: observable, values: [cash_near_threshold]}

  relations:
    shops_at:
      from: person
      to: merchant
      kind: many_to_many
      per_from: {"5-9": 0.5, "10-19": 0.4, "20-30": 0.1}
      select: {pick: "entities('merchant')", where: "it.category != 'gift_cards'", weight: it.popularity}
      edge:
        weight: {type: float, visibility: hidden, dist: gamma, params: {shape: 1.2, scale: 1.0}}
      inverse: shoppers
    contacts:
      from: person
      to: counterparty
      kind: many_to_many
      per_from: {"1-2": 0.4, "3-6": 0.6}
      select: {pick: "entities('counterparty')", where: "it.kind == 'person'", weight: it.popularity}

  events:
    card_purchase:
      fields:
        card: {type: ref, entity: card}
        merchant: {type: ref, entity: merchant}
        amount: {type: money}
        channel: {type: code, values: [card_present, ecommerce]}
        device: {type: ref, entity: device, optional: true}
        ip: {type: ref, entity: ip, optional: true}
      parties: [card.holder]
      recorded_by: [card.account.institution]
      requires:
        - {when: "card.status == 'active'", else: card_inactive}
        - {when: "not card.holder.restricted", else: restricted}
        - {when: "card.account.balance + card.account.credit_line >= amount", else: insufficient_funds}
      # Each observed bank decides on its own cards; `card_auth` on the others too.
      gate: [metro_card_auth, card_auth]
      effects:
        approve:
          - transfer: {payer: card.account, payee: merchant, amount: amount}
        step_up:
          - chance:
              probability: "0.2 if cause.label == 'fraud' else 0.96"
              then:
                - transfer: {payer: card.account, payee: merchant, amount: amount}
        decline: []
        card_inactive: []
        restricted: []
        insufficient_funds: []

    wallet_enroll:
      description: A card added to a phone's wallet.
      fields:
        card: {type: ref, entity: card}
        device: {type: ref, entity: device}
      parties: [card.holder]
      recorded_by: [card.account.institution]
      effects:
        ok: []

    login:
      fields:
        person: {type: ref, entity: person}
        institution: {type: ref, entity: institution}
        device: {type: ref, entity: device}
        ip: {type: ref, entity: ip}
        credential_ok: {type: bool}
      parties: [person]
      recorded_by: [institution]
      requires:
        - {when: credential_ok, else: failed}
      gate: login_check
      effects:
        allow: []
        step_up: []
        block: []
        failed: []

    ach_credit:
      fields:
        account: {type: ref, entity: account}
        amount: {type: money}
        originator: {type: string}
      parties: [account.holder]
      recorded_by: [account.institution]
      requires:
        - {when: "account.status == 'open'", else: not_open}
      effects:
        ok:
          - transfer: {payer: "external('payroll')", payee: account, amount: amount}
        not_open: []

    profile_change:
      fields:
        person: {type: ref, entity: person}
        institution: {type: ref, entity: institution}
        field_changed: {type: code, values: [email, phone, address]}
        device: {type: ref, entity: device}
      parties: [person]
      recorded_by: [institution]
      effects:
        ok: []

    p2p_send:
      fields:
        account: {type: ref, entity: account}
        payee: {type: ref, entity: counterparty}
        # The payee when the payee is in the world, such as a mule whom a scam pays.
        payee_person: {type: ref, entity: person, optional: true}
        amount: {type: money}
        device: {type: ref, entity: device}
        ip: {type: ref, entity: ip}
      parties: [account.holder]
      recorded_by: [account.institution]
      requires:
        - {when: "account.status == 'open'", else: not_open}
        - {when: "not account.holder.restricted", else: restricted}
        - {when: "account.balance + account.credit_line >= amount", else: insufficient_funds}
      gate: [metro_payment_hold, payment_hold]
      effects:
        release:
          - transfer: {payer: account, payee: "external('p2p_network')", amount: amount}
          - if: &p2p_to_world
              when: "payee_person != none and count(payee_person.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
              then:
                # The payee's bank receives it, in the payee's checking account.
                - emit:
                    event: p2p_receive
                    actor: account.holder
                    fields:
                      account: "first(payee_person.accounts, where=it.type == 'checking' and it.status == 'open')"
                      sender_person: account.holder
                      amount: amount
        hold:
          # The bank holds the payment and calls the customer. A scam victim whom the call reaches stops more often.
          - chance:
              probability: "0.35 if cause.label == 'fraud' else 0.95"
              then:
                - transfer: {payer: account, payee: "external('p2p_network')", amount: amount}
                - if: *p2p_to_world
        block: []
        insufficient_funds: []
        restricted: []
        not_open: []

    p2p_receive:
      fields:
        account: {type: ref, entity: account}
        sender: {type: ref, entity: counterparty, optional: true}
        # The sender when the sender is in the world.
        sender_person: {type: ref, entity: person, optional: true}
        amount: {type: money}
      parties: [account.holder]
      recorded_by: [account.institution]
      requires:
        - {when: "account.status == 'open'", else: returned}
      effects:
        ok:
          - transfer: {payer: "external('p2p_network')", amount: amount, payee: account, taint: "1.0 if cause.scenario == 'laundering' else 0.0"}
          # A mule sends most of what a victim sends on: by P2P to the handler's next account, or by wire to an
          # exchange. The victim is outside the world, or a scam victim in it.
          - if:
              when: "account.holder.mule_active and (cause.scenario == 'money_mule' or cause.label == 'fraud')"
              then:
                - chance:
                    probability: params.mule_p2p
                    then:
                      - emit:
                          event: p2p_send
                          actor: account.holder
                          after: {h: {p50: 5, p95: 30}}
                          fields:
                            account: account
                            payee: {pick: "entities('counterparty')", where: "it.kind == 'mule'"}
                            amount: "round(amount * (1 - params.mule_cut), 2)"
                            device: first(account.holder.devices, by=it.created_at)
                            ip: "account.holder.vpn_exit if account.holder.vpn_user else first(account.holder.household.networks)"
                    else:
                      - emit:
                          event: wire_out
                          actor: account.holder
                          after: {h: {p50: 5, p95: 30}}
                          fields:
                            account: account
                            amount: "round(amount * (1 - params.mule_cut), 2)"
        returned: []

    wire_out:
      fields:
        account: {type: ref, entity: account}
        amount: {type: money}
      parties: [account.holder]
      recorded_by: [account.institution]
      requires:
        - {when: "account.status == 'open'", else: not_open}
        - {when: "account.balance + account.credit_line >= amount", else: insufficient_funds}
      effects:
        ok:
          - transfer: {payer: account, payee: "external('exchange')", amount: amount}
        not_open: []
        insufficient_funds: []

    cash_deposit:
      description: Cash paid into an account at a branch.
      fields:
        account: {type: ref, entity: account}
        amount: {type: money}
        branch: {type: code, code_list: branch}
      parties: [account.holder]
      recorded_by: [account.institution]
      requires:
        - {when: "account.status == 'open'", else: not_open}
      effects:
        ok:
          - transfer: {payer: "external('cash')", payee: account, amount: amount, taint: "1.0 if cause.scenario == 'laundering' else 0.0"}
        not_open: []

    cash_withdrawal:
      description: Cash taken from an account at an ATM, with the account's card, or at a branch.
      fields:
        account: {type: ref, entity: account}
        amount: {type: money}
        channel: {type: code, values: [atm, branch]}
        card: {type: ref, entity: card, optional: true}
      parties: [account.holder]
      recorded_by: [account.institution]
      requires:
        - {when: "account.status == 'open'", else: not_open}
        - {when: "not account.holder.restricted", else: restricted}
        - {when: "account.balance + account.credit_line >= amount", else: insufficient_funds}
      effects:
        ok:
          - transfer: {payer: account, payee: "external('cash')", amount: amount}
        not_open: []
        insufficient_funds: []
        restricted: []

    check_deposit:
      description: >-
        A paper check paid into an account. The bank credits it now, or holds the funds until the check clears; a check
        that its drawer's bank refuses comes back days later (`check_return`).
      fields:
        account: {type: ref, entity: account}
        amount: {type: money}
        channel: {type: code, values: [mobile, branch, atm]}
        good: {type: bool, visibility: hidden}
      parties: [account.holder]
      recorded_by: [account.institution]
      requires:
        - {when: "account.status == 'open'", else: not_open}
      gate: deposit_hold
      effects:
        release:
          - transfer: {payer: "external('check_clearing')", amount: amount, payee: account}
        hold:
          # The funds wait until the check clears. A bad check comes back first, and its funds never come.
          - emit:
              event: deposit_available
              actor: account.holder
              after: {bd: {5: 1.0}}
              fields: {account: account, amount: amount, good: good}
        reject: []
        not_open: []

    deposit_available:
      description: The held funds of a check deposit, when the check has cleared.
      fields:
        account: {type: ref, entity: account}
        amount: {type: money}
        good: {type: bool, visibility: hidden}
      parties: [account.holder]
      recorded_by: [account.institution]
      requires:
        - {when: good, else: returned}
      effects:
        ok:
          - transfer: {payer: "external('check_clearing')", amount: amount, payee: account}
        returned: []

    check_return:
      description: A deposited check that its drawer's bank didn't pay. The bank takes the credit back.
      fields:
        account: {type: ref, entity: account}
        amount: {type: money}
      parties: [account.holder]
      recorded_by: [account.institution]
      effects:
        ok:
          - transfer: {payer: account, payee: "external('check_clearing')", amount: amount}

    dispute:
      description: A cardholder disputes a card payment, and the bank credits it back while the merchant answers.
      fields:
        card: {type: ref, entity: card}
        merchant: {type: ref, entity: merchant}
        amount: {type: money}
        reason: {type: code, values: [fraud, not_received, not_as_described]}
      parties: [card.holder]
      recorded_by: [card.account.institution]
      effects:
        ok:
          - transfer: {payer: merchant, payee: card.account, amount: amount}

    dispute_decided:
      description: The merchant's answer to a dispute. A merchant with proof of the sale gets the money back.
      fields:
        card: {type: ref, entity: card}
        merchant: {type: ref, entity: merchant}
        amount: {type: money}
        merchant_wins: {type: bool}
      parties: [card.holder]
      recorded_by: [card.account.institution]
      effects:
        ok:
          - if:
              when: merchant_wins
              then:
                - transfer: {payer: card.account, payee: merchant, amount: amount}

    card_report:
      description: A cardholder reports a card as stolen. The bank blocks it and sends a new card (`card_reissued`).
      fields:
        card: {type: ref, entity: card}
      parties: [card.holder]
      recorded_by: [card.account.institution]
      effects:
        ok:
          - set: {card.status: "'blocked'"}

    card_reissued:
      description: >-
        The new card of a card reported as stolen is active. The world keeps the card's entity, so the new card has the
        old one's id.
      fields:
        card: {type: ref, entity: card}
      parties: [card.holder]
      recorded_by: [card.account.institution]
      effects:
        ok:
          - set: {card.status: "'active'"}

    card_settlement:
      description: A business's card sales of a day, paid into its account by the card networks.
      fields:
        business: {type: ref, entity: business}
        amount: {type: money}
      parties: [business.owner, business]
      recorded_by: [business.institution]
      requires:
        - {when: "business.status == 'open'", else: closed}
      effects:
        ok:
          - transfer: {payer: "external('card_network')", payee: business, amount: amount, taint: "1.0 if cause.scenario == 'laundering' else 0.0"}
        closed: []

    business_chargeback:
      description: A sale that a cardholder disputed, taken back from the business's account.
      fields:
        business: {type: ref, entity: business}
        amount: {type: money}
      parties: [business.owner, business]
      recorded_by: [business.institution]
      effects:
        ok:
          - transfer: {payer: business, payee: "external('card_network')", amount: amount}

    business_payout:
      description: A payment out of a business's account by wire or ACH.
      fields:
        business: {type: ref, entity: business}
        amount: {type: money}
        kind: {type: code, values: [supplier, payroll, owner_draw]}
      parties: [business.owner, business]
      recorded_by: [business.institution]
      requires:
        - {when: "business.balance >= amount", else: insufficient_funds}
      gate: payout_hold
      effects:
        release:
          - transfer: {payer: business, payee: "external('payees')", amount: amount}
        hold:
          # The bank holds the payment and calls the owner. A bust-out crew often stops there.
          - chance:
              probability: "0.3 if cause.label == 'fraud' else 0.97"
              then:
                - transfer: {payer: business, payee: "external('payees')", amount: amount}
        insufficient_funds: []

    transfer_internal:
      description: A transfer between two accounts of one person, at one bank or at two.
      fields:
        from_account: {type: ref, entity: account}
        to_account: {type: ref, entity: account}
        amount: {type: money}
      parties: [from_account.holder]
      recorded_by: [from_account.institution, to_account.institution]
      requires:
        - {when: "from_account.status == 'open' and to_account.status == 'open'", else: not_open}
        - {when: "from_account.balance + from_account.credit_line >= amount", else: insufficient_funds}
      effects:
        ok:
          - transfer: {payer: from_account, payee: to_account, amount: amount}
        not_open: []
        insufficient_funds: []

    account_closed:
      fields:
        account: {type: ref, entity: account}
        reason: {type: code, values: [customer_request, friction, bank_action]}
      parties: [account.holder]
      recorded_by: [account.institution]
      effects:
        ok:
          - set: {account.status: "'closed'"}

    # The analyst's declared tools (env.tools) emit the next three events.
    step_up_requested:
      description: The bank asks for a one-time code, sent to the customer's phone, at each online card payment.
      fields:
        person: {type: ref, entity: person}
      parties: [person]
      recorded_by: ["institution('demo_bank')"]
      effects:
        ok:
          - set: {person.stepped_up: "true"}
    customer_call:
      fields:
        person: {type: ref, entity: person}
      parties: [person]
      recorded_by: ["institution('demo_bank')"]
      effects:
        ok: []
    call_answer:
      fields:
        person: {type: ref, entity: person}
        confirms: {type: bool}
      parties: [person]
      recorded_by: ["institution('demo_bank')"]
      effects:
        ok: []

  processes:
    everyday_card_spend:
      emits: card_purchase
      actor: person
      enabled_if: "self.status == 'active' and count(self.cards, where=it.status == 'active') > 0"
      rate:
        unit: per_month
        per_actor:
          dist: gamma
          params: {shape: params.spend_shape, scale: "params.spend_scale * self.spend_level / params.spend_shape"}
      timing:
        time_zone: actor_local
        hour_of_day: [0.004, 0.002, 0.001, 0.001, 0.002, 0.008, 0.02, 0.04, 0.055, 0.06, 0.065, 0.075,
                      0.09, 0.075, 0.065, 0.06, 0.065, 0.075, 0.08, 0.065, 0.045, 0.028, 0.014, 0.005]
        day_of_week: {mon: 0.13, tue: 0.13, wed: 0.14, thu: 0.14, fri: 0.17, sat: 0.16, sun: 0.13}
      bind:
        card: {pick: self.cards, where: "it.status == 'active'"}
        merchant: {pick: self.shops_at, weight: edge.weight}
        online: {dist: bernoulli, params: {p: merchant.ecommerce_share}}
        tap: {dist: bernoulli, params: {p: "2 * params.wallet_tap_share * self.digital_habit"}}
      fields:
        amount:
          dist: lognormal
          params: {mu: merchant.amount_mu, sigma: merchant.amount_sigma}
          heaping: {share: 0.12, units: {"5": 0.5, "10": 0.3, "20": 0.2}}
          clip: [0.5, 5000]
        channel: "'ecommerce' if online else 'card_present'"
        device: >-
          first(self.devices, by=it.created_at) if channel == 'ecommerce'
          else (first(self.devices, where=it.platform != 'web', by=it.created_at) if tap else none)
        ip: "(self.vpn_exit if self.vpn_user else first(self.household.networks)) if channel == 'ecommerce' else none"

    payroll:
      emits: ach_credit
      actor: person
      enabled_if: "self.status == 'active' and self.age < 67 and count(self.accounts, where=it.type == 'checking') > 0"
      calendar: {pattern: biweekly, weekday: fri, business_day: previous, time: "06:00", jitter: 2h}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
      fields:
        amount: {expr: "self.income_monthly * 12 / 26", round: 2}
        originator: "'PAYROLL'"

    pension:
      emits: ach_credit
      actor: person
      enabled_if: "self.status == 'active' and self.age >= 67 and count(self.accounts, where=it.type == 'checking') > 0"
      calendar: {pattern: monthly, day_of_month: 3, business_day: previous, time: "06:00", jitter: 2h}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
      fields:
        amount: {expr: self.income_monthly, round: 2}
        originator: "'PENSION'"

    habitual_login:
      emits: login
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts) > 0"
      rate:
        unit: per_month
        per_actor: {dist: gamma, params: {shape: 2.0, scale: "params.login_rate * self.digital_habit / 2.0"}}
      timing:
        time_zone: actor_local
        day_of_week: {mon: 0.15, tue: 0.15, wed: 0.15, thu: 0.15, fri: 0.15, sat: 0.13, sun: 0.12}
      bind:
        account: {pick: self.accounts}
      fields:
        person: self
        institution: account.institution
        device: {pick: self.devices}
        ip: "self.vpn_exit if self.vpn_user else first(self.household.networks)"
        credential_ok: {dist: bernoulli, params: {p: 0.97}}

    # Look-alikes for account takeover: an unfamiliar network, a contact change, a large online purchase.
    travel_login:
      emits: login
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts) > 0"
      rate:
        unit: per_year
        per_actor: {dist: gamma, params: {shape: 1.0, scale: params.travel_rate}}
      bind:
        account: {pick: self.accounts}
      fields:
        person: self
        institution: account.institution
        device: {pick: self.devices}
        ip: {pick: "entities('ip')", where: "it.kind == 'household' and it.household != self.household"}
        credential_ok: {dist: bernoulli, params: {p: 0.95}}

    contact_update:
      emits: profile_change
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts) > 0"
      rate:
        unit: per_year
        per_actor: {dist: constant, params: {value: 0.4}}
      bind:
        account: {pick: self.accounts}
      fields:
        person: self
        institution: account.institution
        field_changed: {shares: {email: 0.4, phone: 0.35, address: 0.25}}
        device: {pick: self.devices}

    wallet_setup:
      emits: wallet_enroll
      actor: person
      enabled_if: >-
        self.status == 'active' and count(self.cards, where=it.status == 'active') > 0
        and count(self.devices, where=it.platform != 'web') > 0
      rate:
        unit: per_year
        per_actor: {dist: constant, params: {value: 0.25}}
      bind:
        card: {pick: self.cards, where: "it.status == 'active'"}
        device: {pick: self.devices, where: "it.platform != 'web'"}

    big_online_purchase:
      emits: card_purchase
      actor: person
      enabled_if: "self.status == 'active' and count(self.cards, where=it.status == 'active') > 0"
      rate:
        unit: per_year
        per_actor: {dist: gamma, params: {shape: 1.0, scale: "1.5 * self.spend_level"}}
      bind:
        card: {pick: self.cards, where: "it.status == 'active'"}
        merchant: {pick: "entities('merchant')", where: "it.category == 'electronics'", weight: it.popularity}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(600)", sigma: 0.5}, heaping: {share: 0.5, units: {"50": 0.5, "100": 0.5}}}
        channel: "'ecommerce'"
        device: first(self.devices, by=it.created_at)
        ip: "self.vpn_exit if self.vpn_user else first(self.household.networks)"

    retry_after_decline:
      emits: card_purchase
      on_event: {event: card_purchase, outcome: decline}
      where: "trigger.cause.label != 'fraud'"
      probability: 0.3
      after: {m: {p50: 3, p95: 25}}
      copy_fields: true

    p2p_contact:
      emits: p2p_send
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts, where=it.type == 'checking') > 0"
      rate:
        unit: per_month
        per_actor: {dist: gamma, params: {shape: 1.5, scale: "params.p2p_rate * self.digital_habit / 1.5"}}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
        payee: {pick: self.contacts}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(90)", sigma: 1.1}, heaping: {share: 0.4, units: {"5": 0.4, "10": 0.4, "20": 0.2}}, clip: [1, 5000]}
        device: first(self.devices, by=it.created_at)
        ip: "self.vpn_exit if self.vpn_user else first(self.household.networks)"

    rent_p2p:
      emits: p2p_send
      actor: person
      enabled_if: "self.rent_by_p2p and self.status == 'active' and count(self.accounts, where=it.type == 'checking') > 0"
      calendar: {pattern: monthly, day_of_month: 1, business_day: next, time: "09:00", jitter: 48h}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
      fields:
        payee: first(self.contacts)
        amount: self.rent
        device: first(self.devices, by=it.created_at)
        ip: "self.vpn_exit if self.vpn_user else first(self.household.networks)"

    # Look-alike for scams: a large payment to someone new, such as a deposit or a private sale.
    p2p_new_payee:
      emits: p2p_send
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts, where=it.type == 'checking') > 0"
      rate:
        unit: per_year
        per_actor: {dist: gamma, params: {shape: 1.0, scale: 2.0}}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
        payee: {pick: "entities('counterparty')", where: "it.kind == 'person'"}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(400)", sigma: 1.0}, heaping: {share: 0.5, units: {"50": 0.5, "100": 0.5}}, clip: [5, 10000]}
        device: first(self.devices, by=it.created_at)
        ip: "self.vpn_exit if self.vpn_user else first(self.household.networks)"

    p2p_income:
      emits: p2p_receive
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts, where=it.type == 'checking') > 0"
      rate:
        unit: per_month
        per_actor: {dist: gamma, params: {shape: 1.5, scale: "0.6 * params.p2p_rate * self.digital_habit / 1.5"}}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
        sender: {pick: self.contacts}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(90)", sigma: 1.1}, heaping: {share: 0.4, units: {"5": 0.4, "10": 0.4, "20": 0.2}}, clip: [1, 5000]}

    # Look-alikes for mules: sellers paid by strangers, and customers who buy crypto by wire.
    marketplace_sale:
      emits: p2p_receive
      actor: person
      enabled_if: "self.seller and self.status == 'active' and count(self.accounts, where=it.type == 'checking') > 0"
      rate:
        unit: per_month
        per_actor: {dist: gamma, params: {shape: 2.0, scale: 3.0}}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
        sender: {pick: "entities('counterparty')", where: "it.kind == 'person'"}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(80)", sigma: 0.8}, heaping: {share: 0.5, units: {"5": 0.5, "10": 0.5}}, clip: [5, 5000]}

    crypto_buy:
      emits: wire_out
      actor: person
      enabled_if: "self.crypto_user and self.status == 'active' and count(self.accounts, where=it.type == 'checking') > 0"
      rate:
        unit: per_year
        per_actor: {dist: gamma, params: {shape: 1.0, scale: 6.0}}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(400)", sigma: 0.9}, heaping: {share: 0.5, units: {"50": 0.5, "100": 0.5}}, clip: [20, 20000]}

    churn_after_friction:
      emits: account_closed
      # A false decline, not a step-up that the customer passes: Javelin's 2015 survey found that 39% of falsely
      # declined cardholders stopped using the card.
      on_event: {event: card_purchase, outcome: [decline]}
      where: "trigger.cause.label != 'fraud'"
      probability: params.churn_after_friction
      after: {d: {p50: 9, p95: 40}}
      bind:
        account: trigger.card.account
      fields:
        reason: "'friction'"

    # The bank phones the number on file, which a takeover doesn't change: it changes the email. The customer answers
    # most calls and says whether the recent card payments were theirs. After a takeover they weren't, though a few
    # victims don't see it, and a few customers don't remember a payment of their own. A scam victim and a mule made
    # their own payments, so they say yes.
    customer_answers:
      emits: call_answer
      on_event: {event: customer_call}
      probability: 0.8
      after: {m: {p50: 8, p95: 25}}
      actor_from: trigger.person
      fields:
        person: trigger.person
        confirms: {dist: bernoulli, params: {p: "0.03 if trigger.person.taken_over else 0.95"}}

    # Cash, checks and disputes, with the look-alikes of structuring, check fraud, false chargebacks and card testing.
    atm_cash:
      emits: cash_withdrawal
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
      rate:
        unit: per_month
        per_actor: {dist: gamma, params: {shape: 1.2, scale: "2.5 * (1.2 - self.digital_habit) / 1.2"}}
      timing:
        time_zone: actor_local
        hour_of_day: [0.005, 0.003, 0.002, 0.002, 0.003, 0.01, 0.03, 0.05, 0.06, 0.065, 0.07, 0.065,
                      0.07, 0.075, 0.07, 0.07, 0.075, 0.07, 0.075, 0.05, 0.035, 0.025, 0.012, 0.008]
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking' and it.status == 'open'"}
        teller: {dist: bernoulli, params: {p: 0.1}}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(100)", sigma: 0.7}, heaping: {share: 1.0, units: {"20": 1.0}}, clip: [20, 1000]}
        channel: "'branch' if teller else 'atm'"
        card: "none if teller else first(account.cards, where=it.status == 'active')"

    check_income:
      emits: check_deposit
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts, where=it.status == 'open') > 0"
      rate:
        unit: per_month
        per_actor: {dist: gamma, params: {shape: 1.0, scale: "params.check_income_rate * (1.5 if self.business_owner or self.seller else 1.0)"}}
      bind:
        account: {pick: self.accounts, where: "it.status == 'open'"}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(350)", sigma: 1.1}, heaping: {share: 0.4, units: {"10": 0.3, "50": 0.4, "100": 0.3}}, clip: [5, 25000]}
        channel: {shares: {mobile: 0.75, branch: 0.15, atm: 0.1}}
        good: {dist: bernoulli, params: {p: "1 - params.bad_check_share"}}

    # A check that its drawer's bank refuses comes back: the paying bank's act, not the depositor's.
    returned_check:
      emits: check_return
      on_event: {event: check_deposit, outcome: release}
      where: "not trigger.good"
      after: {bd: {2: 0.4, 3: 0.4, 4: 0.2}}
      fields:
        account: trigger.account
        amount: trigger.amount

    card_verification:
      emits: card_purchase
      actor: person
      enabled_if: "self.status == 'active' and count(self.cards, where=it.status == 'active') > 0"
      rate:
        unit: per_month
        per_actor: {dist: gamma, params: {shape: 1.0, scale: "params.verification_rate * self.digital_habit"}}
      bind:
        card: {pick: self.cards, where: "it.status == 'active'"}
        merchant: {pick: "entities('merchant')", where: "it.category in ('subscription', 'online_retail', 'gift_cards')", weight: it.popularity}
      fields:
        amount: {dist: uniform, params: {low: 0.5, high: 3.0}, heaping: {share: 0.5, units: {"1": 1.0}}}
        channel: "'ecommerce'"
        device: first(self.devices, by=it.created_at)
        ip: "self.vpn_exit if self.vpn_user else first(self.household.networks)"

    card_reissue:
      emits: card_reissued
      on_event: {event: card_report}
      after: {d: {p50: 6, p95: 10}}
      fields:
        card: trigger.card

    # A holder who reports a stolen card disputes the payments that someone else made with it. The dispute is the
    # holder's own act, so its cause is this process.
    fraud_dispute:
      emits: dispute
      on_event: {event: card_report}
      where: "sum(trigger.card.holder.history('card_purchase', '60d'), it.amount, where=it.card == trigger.card and it.actor != trigger.card.holder and it.outcome == 'approve') > 0"
      after: {m: {p50: 15, p95: 120}}
      fields:
        card: trigger.card
        merchant: last(trigger.card.holder.history('card_purchase', '60d'), where=it.card == trigger.card and it.actor != trigger.card.holder and it.outcome == 'approve', by=it.time).merchant
        amount: "sum(trigger.card.holder.history('card_purchase', '60d'), it.amount, where=it.card == trigger.card and it.actor != trigger.card.holder and it.outcome == 'approve')"
        reason: "'fraud'"

    genuine_dispute:
      emits: dispute
      on_event: {event: card_purchase, outcome: approve}
      where: "trigger.cause.kind == 'process'"
      probability: "params.dispute_share * (1.0 if trigger.channel == 'ecommerce' else 0.3)"
      after: {d: {p50: 12, p95: 45}}
      fields:
        card: trigger.card
        merchant: trigger.merchant
        amount: trigger.amount
        reason: {shares: {not_received: 0.45, not_as_described: 0.4, fraud: 0.15}}

    merchant_answers:
      emits: dispute_decided
      on_event: {event: dispute}
      after: {d: {p50: 30, p95: 60}}
      fields:
        card: trigger.card
        merchant: trigger.merchant
        amount: trigger.amount
        # A false chargeback's merchant has proof of delivery more often.
        merchant_wins:
          dist: bernoulli
          params: {p: "0.45 if trigger.cause.scenario == 'false_chargeback' else (0.05 if trigger.reason == 'fraud' else 0.2)"}

    cash_income:
      emits: cash_deposit
      actor: person
      enabled_if: "self.cash_earner and self.status == 'active' and count(self.accounts, where=it.status == 'open') > 0"
      rate:
        unit: per_week
        per_actor: {dist: gamma, params: {shape: 4.0, scale: 0.25}}
      bind:
        account: {pick: self.accounts, where: "it.status == 'open'"}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(600)", sigma: 0.9}, heaping: {share: 0.6, units: {"20": 0.5, "100": 0.5}}, clip: [20, 15000]}
        branch:
          mixture:
            - {weight: 0.85, value: self.home_branch}
            - {weight: 0.15, value: {shares: {central: 0.2, north: 0.15, south: 0.15, east: 0.1, west: 0.1, mall: 0.1, airport: 0.05, downtown: 0.15}}}

    large_cash_deposit:
      description: A large legitimate cash deposit, such as the price of a car sold privately.
      emits: cash_deposit
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts, where=it.status == 'open') > 0"
      rate:
        unit: per_year
        per_actor: {dist: constant, params: {value: 0.08}}
      bind:
        account: {pick: self.accounts, where: "it.status == 'open'"}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(4500)", sigma: 0.7}, heaping: {share: 0.8, units: {"100": 0.5, "500": 0.5}}, clip: [1000, 40000]}
        branch:
          mixture:
            - {weight: 0.85, value: self.home_branch}
            - {weight: 0.15, value: {shares: {central: 0.2, north: 0.15, south: 0.15, east: 0.1, west: 0.1, mall: 0.1, airport: 0.05, downtown: 0.15}}}

    caregiver_payment:
      emits: p2p_send
      actor: person
      enabled_if: "self.has_caregiver and self.status == 'active' and count(self.accounts, where=it.type == 'checking') > 0"
      calendar: {pattern: weekly, weekday: fri, business_day: none, time: "10:00", jitter: 24h}
      bind:
        account: {pick: self.accounts, where: "it.type == 'checking'"}
      fields:
        payee: self.caregiver
        amount: {dist: lognormal, params: {mu: "ln(350)", sigma: 0.3}, heaping: {share: 0.6, units: {"10": 0.5, "50": 0.5}}}
        device: first(self.devices, by=it.created_at)
        ip: "self.vpn_exit if self.vpn_user else first(self.household.networks)"

    own_transfer:
      description: A customer moves money between the customer's own accounts, at one bank or at two.
      emits: transfer_internal
      actor: person
      enabled_if: "self.status == 'active' and count(self.accounts, where=it.status == 'open') >= 2"
      rate:
        unit: per_month
        per_actor: {dist: gamma, params: {shape: 1.0, scale: 1.0}}
      bind:
        from_account: {pick: self.accounts, where: "it.status == 'open'"}
        to_account: {pick: self.accounts, where: "it.status == 'open' and it != from_account"}
      fields:
        amount: {dist: lognormal, params: {mu: "ln(300)", sigma: 1.0}, heaping: {share: 0.6, units: {"50": 0.5, "100": 0.5}}, clip: [10, 20000]}

    # Small businesses: card sales each business day, payments to suppliers and staff, and chargebacks.
    daily_settlement:
      emits: card_settlement
      actor: business
      enabled_if: "self.status == 'open'"
      rate:
        unit: per_month
        per_actor: {dist: constant, params: {value: 21}}
      timing:
        day_of_week: {mon: 0.2, tue: 0.2, wed: 0.2, thu: 0.2, fri: 0.2, sat: 0.0, sun: 0.0}
      fields:
        business: self
        # A business in a legitimate surge (a season, a product that sells) takes three times its usual sales.
        amount: {dist: lognormal, params: {mu: "ln(self.sales_daily * (3 if self.surging else 1))", sigma: 0.35}, round: 2}

    business_expenses:
      emits: business_payout
      actor: business
      enabled_if: "self.status == 'open'"
      calendar: {pattern: weekly, weekday: thu, business_day: previous, time: "11:00", jitter: 6h}
      fields:
        business: self
        amount: {dist: lognormal, params: {mu: "ln(self.sales_daily * 2.0)", sigma: 0.4}, round: 2}
        kind: {shares: {payroll: 0.4, supplier: 0.45, owner_draw: 0.15}}

    # An owner takes most of what the account holds a few times a year, such as for taxes or a large purchase.
    owner_withdrawal:
      emits: business_payout
      actor: business
      enabled_if: "self.status == 'open' and self.balance > 2000"
      rate:
        unit: per_year
        per_actor: {dist: gamma, params: {shape: 1.0, scale: 3.0}}
      fields:
        business: self
        amount: "round(0.7 * self.balance, 2)"
        kind: "'owner_draw'"

    business_chargebacks:
      emits: business_chargeback
      actor: business
      enabled_if: "self.status == 'open'"
      rate:
        unit: per_month
        per_actor: {dist: constant, params: {value: "self.chargeback_share * 21 * self.sales_daily / 60"}}
      fields:
        business: self
        amount: {dist: lognormal, params: {mu: "ln(60)", sigma: 0.8}, round: 2}

  machines:
    alert_case:
      entity: alert
      initial: queued
      states:
        queued:
          transitions:
            - {to: in_review, queue: analyst}
        in_review:
          gate: alert_review
          next: {clear: cleared, restrict: restricted, close_account: closed, file_sar: sar_filed}
        cleared: {terminal: true}
        restricted:
          enter:
            - set: {self.subject.restricted: "true"}
          terminal: true
        closed:
          enter:
            - set: {self.subject.status: "'closed'"}
          terminal: true
        sar_filed:
          enter:
            - set: {self.subject.restricted: "true"}
          terminal: true

    aml_case:
      entity: aml_alert
      initial: queued
      states:
        queued:
          transitions:
            - {to: in_review, queue: aml_analyst}
        in_review:
          gate: aml_review
          next: {clear: cleared, file_sar: sar_filed, close_account: closed}
        cleared: {terminal: true}
        sar_filed: {terminal: true}
        closed:
          enter:
            - set: {self.subject.status: "'closed'"}
          terminal: true

    # A legitimate surge in a business's sales, the look-alike of a bust-out's ramp.
    business_growth:
      entity: business
      initial: steady
      states:
        steady:
          transitions:
            - {to: surge, hazard: {per_year: 0.8}}
        surge:
          enter:
            - set: {self.surging: "true"}
          transitions:
            - {to: settle, after: {d: {p50: 21, p95: 45}}}
        settle:
          enter:
            - set: {self.surging: "false"}
          transitions:
            - {to: surge, hazard: {per_year: 0.8}}

  signals:
    login_ip_risk:
      description: A vendor's IP risk score on logins.
      attach_to: {event: login}
      adds: ip_risk
      type: float
      value: "0.85 if ip.kind == 'data_center' else 0.08"
      noise: {dist: normal, params: {mean: 0, sd: 0.07}}
      clip: [0, 1]
    login_device_risk:
      description: A vendor's device reputation score on logins.
      attach_to: {event: login}
      adds: device_risk
      type: float
      value: "0.9 if device.kind == 'emulator' else (0.75 if device.risky else 0.05)"
      noise: {dist: normal, params: {mean: 0, sd: 0.1}}
      clip: [0, 1]
    p2p_ip_risk:
      description: The same vendor's IP risk score on P2P payments.
      attach_to: {event: p2p_send}
      adds: ip_risk
      type: float
      value: "0.85 if ip.kind == 'data_center' else 0.08"
      noise: {dist: normal, params: {mean: 0, sd: 0.07}}
      clip: [0, 1]
    card_ip_risk:
      description: The same vendor's IP risk score on online card purchases.
      attach_to: {event: card_purchase}
      adds: ip_risk
      type: float
      value: "0.0 if ip == none else (0.85 if ip.kind == 'data_center' else 0.08)"
      noise: {dist: normal, params: {mean: 0, sd: 0.07}}
      clip: [0, 1]

  scenarios:
    account_takeover:
      family: account_takeover
      label: fraud
      anchor: victim
      adversary: fraudster
      roles:
        victim:
          entity: person
          select:
            where: "self.status == 'active' and count(self.cards) > 0"
            odds: "exp(1.5 * self.password_reuse + (0.6 if self.age >= 65 else 0.0))"
        fraudster:
          entity: fraudster
          select: {odds: "1 + self.skill"}
        device:
          entity: device
          select: {where: "self.kind == 'emulator'"}
        proxy:
          entity: ip
          select: {where: "self.kind == 'data_center'"}
        farm_device:
          entity: device
          select: {where: "self.kind == 'farm'"}
        res_proxy:
          entity: ip
          select: {where: "self.kind == 'residential_proxy'"}
        kit:
          entity: attack_kit
          create: true
        shop:
          description: One of the victim's own shops.
          entity: merchant
          select: {where: "count(victim.shops_at, where=it == self) > 0"}
      prevalence:
        rate_per_year: params.ato_rate
        campaigns: {waves_per_year: 3, multiplier: 4, duration: 7d}
      look_alikes: [travel_login, contact_update, big_online_purchase, wallet_setup]
      difficulty: [ato_stealth, ato_stealth_route, ato_blend]
      steps:
        initial: prepare
        states:
          prepare:
            gate: ato_route
            next: {cheap: credential_test, stealth: go_stealth}
          go_stealth:
            enter:
              - set: {kit.stealth: "true"}
            transitions:
              - {to: credential_test, after: {m: {p50: 10, p95: 60}}}
          credential_test:
            enter:
              - emit:
                  event: login
                  actor: fraudster
                  fields:
                    person: victim
                    institution: first(victim.accounts).institution
                    device: "farm_device if kit.stealth else device"
                    ip: "res_proxy if kit.stealth else proxy"
                    credential_ok: {dist: bernoulli, params: {p: "0.9 if kit.stealth else 0.35"}}
            transitions:
              - {to: takeover, on_event: {event: login, outcome: allow}}
              - {to: abandoned, on_event: {event: login, outcome: block}}
              - {to: credential_test, after: {h: {p50: 6, p95: 30}}}
              - {to: abandoned, hazard: {per_day: 0.3}}
          takeover:
            enter:
              - label:
                  name: account_takeover
                  subject: victim
                  knowable_after: {d: {p50: 4, p95: 21}}
                  discovery:
                    probability: 0.8
                    after: {d: {p50: 6, p95: 35}}
                    channels: {customer_report: 0.6, analyst: 0.3, chargeback: 0.1}
              - set: {victim.taken_over: "true"}
            gate: ato_takeover
            next: {change_email: hijack, keep_contact: wait}
          hijack:
            enter:
              - set: {victim.contact_hijacked: "true"}
              - emit:
                  event: profile_change
                  actor: fraudster
                  after: {m: {p50: 20, p95: 120}}
                  fields:
                    person: victim
                    institution: first(victim.accounts).institution
                    field_changed: "'email'"
                    device: "farm_device if kit.stealth else device"
            transitions:
              - {to: plan, after: {h: {p50: 3, p95: 24}}}
          wait:
            transitions:
              - {to: plan, after: {h: {p50: 3, p95: 24}}}
          plan:
            gate: ato_cash_out
            next: {small: spend_small, medium: spend_medium, large: spend_large, blend: spend_own, drain: drain,
                   stop: done}
          spend_small:
            enter:
              - if:
                  when: "count(victim.cards, where=it.status == 'active') > 0"
                  then:
                    - emit:
                        event: card_purchase
                        actor: fraudster
                        fields:
                          card: {pick: victim.cards, where: "it.status == 'active'"}
                          merchant:
                            pick: "entities('merchant')"
                            where: "it.category in ('electronics', 'gift_cards')"
                            weight: it.popularity
                          amount:
                            dist: lognormal
                            params: {mu: "ln(120) - params.ato_stealth", sigma: 0.4}
                            heaping: {share: 0.6, units: {"50": 0.5, "100": 0.5}}
                          channel: "'ecommerce'"
                          device: "farm_device if kit.stealth else device"
                          ip: "res_proxy if kit.stealth else proxy"
            transitions:
              # A step-up stops an online cash-out: the code goes to the customer's phone, which the crook doesn't
              # have.
              - to: done
                when: >-
                  victim.restricted or victim.stepped_up
                  or count(victim.cards, where=it.status == 'active') == 0
              - {to: plan, after: {h: {p50: 2, p95: 12}}}
              - {to: done, hazard: {per_day: "0.8 if victim.contact_hijacked else 0.8 + params.ato_notice_rate"}}
          spend_medium:
            enter:
              - if:
                  when: "count(victim.cards, where=it.status == 'active') > 0"
                  then:
                    - emit:
                        event: card_purchase
                        actor: fraudster
                        fields:
                          card: {pick: victim.cards, where: "it.status == 'active'"}
                          merchant:
                            pick: "entities('merchant')"
                            where: "it.category in ('electronics', 'gift_cards')"
                            weight: it.popularity
                          amount:
                            dist: lognormal
                            params: {mu: "ln(400) - params.ato_stealth", sigma: 0.5}
                            heaping: {share: 0.6, units: {"50": 0.5, "100": 0.5}}
                          channel: "'ecommerce'"
                          device: "farm_device if kit.stealth else device"
                          ip: "res_proxy if kit.stealth else proxy"
            transitions:
              # A step-up stops an online cash-out: the code goes to the customer's phone, which the crook doesn't
              # have.
              - to: done
                when: >-
                  victim.restricted or victim.stepped_up
                  or count(victim.cards, where=it.status == 'active') == 0
              - {to: plan, after: {h: {p50: 2, p95: 12}}}
              - {to: done, hazard: {per_day: "0.8 if victim.contact_hijacked else 0.8 + params.ato_notice_rate"}}
          spend_large:
            enter:
              - if:
                  when: "count(victim.cards, where=it.status == 'active') > 0"
                  then:
                    - emit:
                        event: card_purchase
                        actor: fraudster
                        fields:
                          card: {pick: victim.cards, where: "it.status == 'active'"}
                          merchant:
                            pick: "entities('merchant')"
                            where: "it.category in ('electronics', 'gift_cards')"
                            weight: it.popularity
                          amount:
                            dist: lognormal
                            params: {mu: "ln(1300) - params.ato_stealth", sigma: 0.15}
                            heaping: {share: 0.6, units: {"50": 0.5, "100": 0.5}}
                          channel: "'ecommerce'"
                          device: "farm_device if kit.stealth else device"
                          ip: "res_proxy if kit.stealth else proxy"
            transitions:
              # A step-up stops an online cash-out: the code goes to the customer's phone, which the crook doesn't
              # have.
              - to: done
                when: >-
                  victim.restricted or victim.stepped_up
                  or count(victim.cards, where=it.status == 'active') == 0
              - {to: plan, after: {h: {p50: 2, p95: 12}}}
              - {to: done, hazard: {per_day: "0.8 if victim.contact_hijacked else 0.8 + params.ato_notice_rate"}}
          spend_own:
            # As the victim would buy: online as often as the victim buys at the shop online, and otherwise in the
            # shop, where a mule pays with the card in a phone wallet on a farm phone.
            enter:
              - if:
                  when: "count(victim.cards, where=it.status == 'active') > 0"
                  then:
                    - chance:
                        probability: shop.ecommerce_share
                        then:
                          - emit:
                              event: card_purchase
                              actor: fraudster
                              fields:
                                card: {pick: victim.cards, where: "it.status == 'active'"}
                                merchant: shop
                                amount:
                                  dist: lognormal
                                  params: {mu: shop.amount_mu, sigma: shop.amount_sigma}
                                  heaping: {share: 0.12, units: {"5": 0.5, "10": 0.3, "20": 0.2}}
                                channel: "'ecommerce'"
                                device: "farm_device if kit.stealth else device"
                                ip: "res_proxy if kit.stealth else proxy"
                        else:
                          - if:
                              when: "kit.wallet_card == none"
                              then:
                                - set: {kit.wallet_card: "first(victim.cards, where=it.status == 'active')"}
                                - emit:
                                    event: wallet_enroll
                                    actor: fraudster
                                    fields:
                                      card: "first(victim.cards, where=it.status == 'active')"
                                      device: farm_device
                          - emit:
                              event: card_purchase
                              actor: fraudster
                              after: {m: {p50: 30, p95: 180}}
                              fields:
                                card: kit.wallet_card
                                merchant: shop
                                amount:
                                  dist: lognormal
                                  params: {mu: shop.amount_mu, sigma: shop.amount_sigma}
                                  heaping: {share: 0.12, units: {"5": 0.5, "10": 0.3, "20": 0.2}}
                                channel: "'card_present'"
                                device: farm_device
            transitions:
              - {to: done, when: "victim.restricted or count(victim.cards, where=it.status == 'active') == 0"}
              - {to: plan, after: {h: {p50: 2, p95: 12}}}
              - {to: done, hazard: {per_day: "0.8 if victim.contact_hijacked else 0.8 + params.ato_notice_rate"}}
          drain:
            # Most of the checking account's balance, up to the P2P limit, by P2P to a mule account outside the world.
            enter:
              - if:
                  when: "count(victim.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 20) > 0"
                  then:
                    - emit:
                        event: p2p_send
                        actor: fraudster
                        fields:
                          account: "first(victim.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 20)"
                          payee: {pick: "entities('counterparty')", where: "it.kind == 'mule'"}
                          # Most of the balance up to the P2P limit; with `ato_blend`, a payment the size of the
                          # victim's own P2P payments.
                          amount:
                            dist: lognormal
                            params:
                              mu: >-
                                (1 - params.ato_blend) * (ln(min(params.p2p_limit, 0.8 * first(victim.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 20).balance))
                                - params.ato_stealth) + params.ato_blend * ln(90)
                              sigma: "0.05 + 1.05 * params.ato_blend"
                            clip: [1, params.p2p_limit]
                            round: 2
                          device: "farm_device if kit.stealth else device"
                          ip: "res_proxy if kit.stealth else proxy"
            transitions:
              - {to: done, when: "victim.restricted"}
              - {to: plan, after: {h: {p50: 2, p95: 12}}}
              - {to: done, hazard: {per_day: "0.8 if victim.contact_hijacked else 0.8 + params.ato_notice_rate"}}
          abandoned: {terminal: true}
          done: {terminal: true}

    app_scam:
      family: app_scam
      label: fraud
      anchor: victim
      roles:
        victim:
          entity: person
          select:
            where: "self.status == 'active' and count(self.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
            odds: "exp(2.5 * self.isolation + (0.9 if self.age >= 65 else 0.0))"
        scammer:
          entity: fraudster
          select: {odds: "1 + self.skill"}
        payee:
          description: The mule account that the scammer gives the victim.
          entity: counterparty
          select: {where: "self.kind == 'mule'"}
        slot:
          description: A slot of the mule pool. When a mule in the world works there, the victim pays that mule.
          entity: mule_pool
        plan:
          entity: scam_plan
          create: true
      prevalence:
        rate_per_year: params.scam_rate
        campaigns: {waves_per_year: 4, multiplier: 3, duration: 10d}
      look_alikes: [p2p_new_payee, p2p_contact]
      difficulty: [scam_small]
      steps:
        initial: groom
        states:
          groom:
            enter:
              - label:
                  name: app_scam
                  subject: victim
                  knowable_after: {d: {p50: 14, p95: 90}}
                  discovery:
                    probability: 0.6
                    after: {d: {p50: 20, p95: 120}}
                    channels: {customer_report: 0.8, analyst: 0.2}
            transitions:
              # An impersonator rushes the victim; a romance or an investment takes weeks.
              - {to: pay, hazard: {per_day: "24.0 if plan.kind == 'impersonation' else (0.07 if plan.kind == 'romance' else 0.15)"}}
          pay:
            enter:
              - if:
                  when: "count(victim.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
                  then:
                    # The victim pays, from the victim's own phone and network.
                    - emit:
                        event: p2p_send
                        actor: victim
                        fields:
                          account: "first(victim.accounts, where=it.type == 'checking' and it.status == 'open')"
                          payee: payee
                          # The mule in the scam's slot of the pool, if one works there now, or else one outside the world.
                          payee_person: >-
                            slot.account.holder if slot.account != none and slot.account.status == 'open'
                            and slot.account.holder.mule_active else none
                          amount:
                            dist: lognormal
                            params:
                              mu: >-
                                (ln(50 + 0.6 * max(0, first(victim.accounts, where=it.type == 'checking' and it.status == 'open').balance)) if plan.kind == 'impersonation'
                                else (ln(300) + 0.2 * plan.paid if plan.kind == 'romance' else ln(900) + 0.3 * plan.paid))
                                - params.scam_small
                              sigma: 0.35
                            heaping: {share: 0.5, units: {"50": 0.5, "100": 0.5}}
                          device: first(victim.devices, by=it.created_at)
                          ip: "victim.vpn_exit if victim.vpn_user else first(victim.household.networks)"
              - set: {plan.paid: "plan.paid + 1"}
            transitions:
              - {to: done, on_event: {event: p2p_send, outcome: block}}
              - {to: done, when: "victim.restricted or count(victim.accounts, where=it.type == 'checking' and it.status == 'open') == 0"}
              - {to: pay, hazard: {per_day: "2.0 if plan.kind == 'impersonation' else (0.15 if plan.kind == 'romance' else 0.2)"}}
              - {to: done, hazard: {per_day: "3.0 if plan.kind == 'impersonation' else (0.03 if plan.kind == 'romance' else 0.06)"}}
          done: {terminal: true}

    money_mule:
      family: money_mule
      label: laundering
      anchor: mule
      roles:
        mule:
          entity: person
          select:
            where: "self.status == 'active' and count(self.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
            odds: "exp(3.0 * self.financial_stress + (0.7 if self.age < 26 else 0.0))"
        handler:
          entity: fraudster
          select: {odds: "1 + self.skill"}
        slot:
          description: The slot of the mule pool that holds this mule's account while the mule works.
          entity: mule_pool
      prevalence:
        rate_per_year: params.mule_rate
        campaigns: {waves_per_year: 2, multiplier: 3, duration: 21d}
      look_alikes: [marketplace_sale, crypto_buy]
      difficulty: [mule_small, mule_p2p]
      steps:
        initial: recruit
        states:
          recruit:
            enter:
              - label:
                  name: money_mule
                  subject: mule
                  knowable_after: {d: {p50: 30, p95: 120}}
                  discovery:
                    probability: 0.5
                    after: {d: {p50: 45, p95: 180}}
                    channels: {analyst: 0.6, law_enforcement: 0.4}
              - set: {mule.mule_active: "true"}
              - if:
                  when: "count(mule.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
                  then:
                    - set: {slot.account: "first(mule.accounts, where=it.type == 'checking' and it.status == 'open')"}
            transitions:
              - {to: receive, after: {d: {p50: 2, p95: 10}}}
          receive:
            enter:
              - if:
                  when: "count(mule.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
                  then:
                    # A victim outside the world pays the mule; the receipt's effects wire most of it on.
                    - emit:
                        event: p2p_receive
                        actor: handler
                        fields:
                          account: "first(mule.accounts, where=it.type == 'checking' and it.status == 'open')"
                          sender: {pick: "entities('counterparty')", where: "it.kind == 'person'"}
                          amount:
                            dist: lognormal
                            params: {mu: "ln(900) - params.mule_small", sigma: 0.6}
                            heaping: {share: 0.5, units: {"50": 0.5, "100": 0.5}}
            transitions:
              - {to: done, when: "mule.restricted or mule.status == 'closed'"}
              - {to: receive, hazard: {per_day: 0.4}}
              - {to: done, hazard: {per_day: 0.02}}
          done:
            enter:
              - set: {mule.mule_active: "false"}
              - if:
                  when: "slot.account != none and slot.account.holder == mule"
                  then:
                    - set: {slot.account: none}
            terminal: true

    card_testing:
      family: card_compromise
      label: fraud
      anchor: card
      roles:
        card:
          entity: card
          select:
            where: "self.status == 'active'"
            odds: "exp(2.0 * self.holder.digital_habit)"
        crew:
          entity: fraudster
          select: {odds: "1 + self.skill"}
        exit:
          description: The crew's network exit, a data center or, with `card_test_proxy`, a residential proxy.
          entity: ip
          select:
            where: "self.kind in ('data_center', 'residential_proxy')"
            odds: "params.card_test_proxy if self.kind == 'residential_proxy' else 1 - params.card_test_proxy"
        bot:
          entity: device
          select:
            where: "self.kind in ('emulator', 'farm')"
            odds: "params.card_test_proxy if self.kind == 'farm' else 1 - params.card_test_proxy"
        tester:
          description: A merchant whose online checkout the crew tests cards at.
          entity: merchant
          select: {where: "self.category in ('subscription', 'online_retail', 'gift_cards')", odds: self.popularity}
        shop:
          description: One of the holder's own shops.
          entity: merchant
          select: {where: "count(card.holder.shops_at, where=it == self) > 0"}
        kit:
          entity: card_crew
          create: true
      prevalence:
        rate_per_year: params.card_compromise_rate
        # Breaches expose many cards at once.
        campaigns: {waves_per_year: 4, multiplier: 5, duration: 14d}
      look_alikes: [card_verification, big_online_purchase, genuine_dispute]
      difficulty: [card_test_stealth, card_test_proxy]
      steps:
        initial: breach
        states:
          breach:
            # The card's details are stolen (a breached merchant, a skimmer, a phishing page) and sold.
            enter:
              - chance:
                  probability: params.card_test_stealth
                  then:
                    - set: {kit.stealth: "true"}
              - chance:
                  probability: params.card_skim_share
                  then:
                    - set: {kit.counterfeit: "true"}
            transitions:
              - {to: test, after: {d: {p50: 3, p95: 20}}}
          test:
            # A tiny charge at a test merchant, or with `card_test_stealth` one like the holder's own.
            enter:
              - if:
                  when: "card.status == 'active'"
                  then:
                    - if:
                        when: kit.stealth
                        then:
                          - emit:
                              event: card_purchase
                              actor: crew
                              fields:
                                card: card
                                merchant: shop
                                amount: {dist: lognormal, params: {mu: shop.amount_mu, sigma: shop.amount_sigma}, clip: [0.5, 5000]}
                                channel: "'ecommerce'"
                                device: bot
                                ip: exit
                        else:
                          - emit:
                              event: card_purchase
                              actor: crew
                              fields:
                                card: card
                                merchant: tester
                                amount: {dist: uniform, params: {low: 0.5, high: 2.5}}
                                channel: "'ecommerce'"
                                device: bot
                                ip: exit
            transitions:
              - {to: sold, on_event: {event: card_purchase, outcome: approve}}
              - {to: abandoned, on_event: {event: card_purchase, outcome: [decline, step_up, insufficient_funds, card_inactive, restricted]}}
              - {to: abandoned, after: 2d}
          sold:
            # The card works. Most holders notice the cash-out and report it; a test alone is seldom noticed.
            enter:
              - label:
                  name: card_compromise
                  subject: card.holder
                  knowable_after: {d: {p50: 7, p95: 30}}
                  discovery:
                    probability: 0.85
                    after: {d: {p50: 8, p95: 35}}
                    channels: {customer_report: 0.75, chargeback: 0.15, analyst: 0.1}
            transitions:
              - {to: cash_out, after: {d: {p50: 4, p95: 15}}}
          cash_out:
            # Online with the card's details, or in shops with a counterfeit of a skimmed card.
            enter:
              - if:
                  when: "card.status == 'active'"
                  then:
                    - if:
                        when: kit.stealth
                        then:
                          - if:
                              when: kit.counterfeit
                              then:
                                - emit:
                                    event: card_purchase
                                    actor: crew
                                    fields:
                                      card: card
                                      merchant: shop
                                      amount: {dist: lognormal, params: {mu: "shop.amount_mu + 0.5", sigma: shop.amount_sigma}, clip: [0.5, 5000]}
                                      channel: "'card_present'"
                              else:
                                - emit:
                                    event: card_purchase
                                    actor: crew
                                    fields:
                                      card: card
                                      merchant: shop
                                      amount: {dist: lognormal, params: {mu: "shop.amount_mu + 0.5", sigma: shop.amount_sigma}, clip: [0.5, 5000]}
                                      channel: "'ecommerce'"
                                      device: bot
                                      ip: exit
                        else:
                          - if:
                              when: kit.counterfeit
                              then:
                                - emit:
                                    event: card_purchase
                                    actor: crew
                                    fields:
                                      card: card
                                      merchant:
                                        pick: "entities('merchant')"
                                        where: "it.category in ('electronics', 'gift_cards', 'grocery')"
                                        weight: it.popularity
                                      amount:
                                        dist: lognormal
                                        params: {mu: "ln(45)", sigma: 0.9}
                                        heaping: {share: 0.3, units: {"5": 0.5, "10": 0.5}}
                                        clip: [5, 2500]
                                      channel: "'card_present'"
                              else:
                                - emit:
                                    event: card_purchase
                                    actor: crew
                                    fields:
                                      card: card
                                      merchant:
                                        pick: "entities('merchant')"
                                        where: "it.category in ('electronics', 'gift_cards', 'online_retail')"
                                        weight: it.popularity
                                      amount:
                                        dist: lognormal
                                        params: {mu: "ln(45)", sigma: 0.9}
                                        heaping: {share: 0.3, units: {"5": 0.5, "10": 0.5}}
                                        clip: [5, 2500]
                                      channel: "'ecommerce'"
                                      device: bot
                                      ip: exit
            transitions:
              - {to: reported, when: "card.status != 'active' or card.holder.restricted"}
              - {to: reported, on_event: {event: card_purchase, outcome: [decline, step_up]}}
              - {to: cash_out, after: {h: {p50: 2, p95: 8}}}
              - {to: reported, hazard: {per_day: 2.0}}
          reported:
            # The holder reports the card, and then disputes what the crew got (`fraud_dispute`).
            enter:
              - emit:
                  event: card_report
                  actor: card.holder
                  after: {d: {p50: 5, p95: 30}}
                  fields: {card: card}
            transitions:
              - {to: done, after: 1h}
          abandoned: {terminal: true}
          done: {terminal: true}

    synthetic_bust_out:
      family: synthetic_identity
      label: fraud
      anchor: identity
      roles:
        identity:
          entity: person
          select:
            where: "self.synthetic and not self.busted and self.status == 'active'"
        ring:
          entity: fraudster
          select: {odds: "1 + self.skill"}
        drop:
          description: A mule account outside the world that takes the identity's P2P payments.
          entity: counterparty
          select: {where: "self.kind == 'mule'"}
        shop:
          entity: merchant
          select: {where: "count(identity.shops_at, where=it == self) > 0"}
      prevalence:
        rate_per_year: params.bustout_rate
        campaigns: {waves_per_year: 2, multiplier: 4, duration: 14d}
      look_alikes: [everyday_card_spend, big_online_purchase, p2p_new_payee, check_income]
      difficulty: [bustout_slow, synthetic_proxy]
      steps:
        initial: start
        states:
          start:
            # Banks find most bust-outs at charge-off, if they ever tell them from credit losses.
            enter:
              - label:
                  name: synthetic_identity
                  subject: identity
                  knowable_after: {d: {p50: 75, p95: 160}}
                  discovery:
                    probability: 0.3
                    after: {d: {p50: 100, p95: 220}}
                    channels: {charge_off_review: 0.7, analyst: 0.3}
              - set: {identity.busted: "true"}
            transitions:
              - {to: spend, after: {m: {p50: 30, p95: 240}}}
          spend:
            enter: &bustout_spend
              - if:
                  when: "count(identity.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance + it.credit_line > 50) > 0"
                  then:
                    - chance:
                        probability: 0.6
                        then:
                          - if:
                              when: "count(identity.cards, where=it.status == 'active') > 0"
                              then:
                                - chance:
                                    probability: params.bustout_slow
                                    then:
                                      - emit:
                                          event: card_purchase
                                          actor: identity
                                          fields:
                                            card: {pick: identity.cards, where: "it.status == 'active'"}
                                            merchant: shop
                                            amount: {dist: lognormal, params: {mu: "shop.amount_mu + 0.7", sigma: shop.amount_sigma}, clip: [1, 5000]}
                                            channel: {shares: {ecommerce: 0.5, card_present: 0.5}}
                                            device: first(identity.devices, by=it.created_at)
                                            ip: identity.vpn_exit
                                    else:
                                      - emit:
                                          event: card_purchase
                                          actor: identity
                                          fields:
                                            card: {pick: identity.cards, where: "it.status == 'active'"}
                                            merchant:
                                              pick: "entities('merchant')"
                                              where: "it.category in ('electronics', 'gift_cards')"
                                              weight: it.popularity
                                            amount:
                                              dist: lognormal
                                              params: {mu: "ln(700)", sigma: 0.4}
                                              heaping: {share: 0.6, units: {"50": 0.5, "100": 0.5}}
                                            channel: {shares: {ecommerce: 0.6, card_present: 0.4}}
                                            device: first(identity.devices, by=it.created_at)
                                            ip: identity.vpn_exit
                        else:
                          - emit:
                              event: p2p_send
                              actor: identity
                              fields:
                                account: "first(identity.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance + it.credit_line > 50)"
                                payee: drop
                                amount:
                                  dist: lognormal
                                  params:
                                    mu: >-
                                      ln(max(20, 0.9 * (first(identity.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance + it.credit_line > 50).balance
                                      + first(identity.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance + it.credit_line > 50).credit_line)))
                                      - 1.5 * params.bustout_slow
                                    sigma: 0.1
                                  clip: [1, params.p2p_limit]
                                  round: 2
                                device: first(identity.devices, by=it.created_at)
                                ip: identity.vpn_exit
            transitions:
              - {to: done, when: "identity.restricted or identity.status == 'closed'"}
              - {to: spend, after: {h: {p50: 4, p95: 16}}}
              - {to: bad_check, hazard: {per_day: "0.5 * (1 - 0.7 * params.bustout_slow)"}}
          bad_check:
            # A check from another bank restores the line; it comes back unpaid.
            enter:
              - if:
                  when: "count(identity.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
                  then:
                    - emit:
                        event: check_deposit
                        actor: identity
                        fields:
                          account: "first(identity.accounts, where=it.type == 'checking' and it.status == 'open')"
                          amount:
                            dist: lognormal
                            params: {mu: "ln(2500) - 2.0 * params.bustout_slow", sigma: "0.4 + 0.7 * params.bustout_slow"}
                            heaping: {share: 0.4, units: {"10": 0.3, "50": 0.4, "100": 0.3}}
                            clip: [20, 20000]
                          channel: {shares: {mobile: 0.75, branch: 0.15, atm: 0.1}}
                          good: "false"
            transitions:
              - {to: kite, on_event: {event: check_deposit, outcome: release}}
              - {to: done, on_event: {event: check_deposit, outcome: [hold, reject, not_open]}}
              - {to: done, after: 1d}
          kite:
            # The check comes back in a few business days (`returned_check`); the money leaves before it does.
            transitions:
              - {to: spend_again, after: {m: {p50: 30, p95: 180}}}
          spend_again:
            enter: *bustout_spend
            transitions:
              - {to: done, when: "identity.restricted or identity.status == 'closed'"}
              - {to: spend_again, after: {h: {p50: 4, p95: 16}}}
              - {to: done, hazard: {per_day: "0.5 * (1 - 0.7 * params.bustout_slow)"}}
          done: {terminal: true}

    check_fraud:
      family: first_party
      label: fraud
      anchor: depositor
      roles:
        depositor:
          entity: person
          select:
            where: "self.status == 'active' and not self.synthetic"
            odds: "exp(2.5 * self.financial_stress + (0.6 if self.age < 30 else 0.0))"
        friend:
          entity: counterparty
          select: {where: "self.kind == 'person'"}
      prevalence:
        rate_per_year: params.check_fraud_rate
        # Counterfeit check rings recruit account holders online, in waves.
        campaigns: {waves_per_year: 3, multiplier: 4, duration: 14d}
      look_alikes: [check_income, atm_cash, p2p_new_payee]
      difficulty: [check_small]
      steps:
        initial: deposit
        states:
          deposit:
            enter:
              - label:
                  name: check_fraud
                  subject: depositor
                  knowable_after: {d: {p50: 5, p95: 15}}
                  discovery:
                    probability: 0.8
                    after: {d: {p50: 6, p95: 30}}
                    channels: {returned_item: 0.8, analyst: 0.2}
              - if:
                  when: "count(depositor.accounts, where=it.type == 'checking' and it.status == 'open') > 0"
                  then:
                    - emit:
                        event: check_deposit
                        actor: depositor
                        fields:
                          account: "first(depositor.accounts, where=it.type == 'checking' and it.status == 'open')"
                          amount:
                            dist: lognormal
                            params: {mu: "ln(2400) - params.check_small", sigma: 0.5}
                            heaping: {share: 0.3, units: {"10": 0.5, "100": 0.5}}
                            clip: [50, 20000]
                          channel: {shares: {mobile: 0.75, branch: 0.15, atm: 0.1}}
                          good: "false"
            transitions:
              - {to: cash_out, on_event: {event: check_deposit, outcome: release}}
              - {to: done, on_event: {event: check_deposit, outcome: [hold, reject, not_open]}}
              - {to: done, after: 1d}
          cash_out:
            # The check comes back in a few business days (`returned_check`); the money leaves before it does.
            transitions:
              - {to: withdraw, after: {m: {p50: 20, p95: 120}}}
          withdraw:
            enter:
              - if:
                  when: "count(depositor.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 20) > 0"
                  then:
                    - chance:
                        probability: 0.5
                        then:
                          - emit:
                              event: cash_withdrawal
                              actor: depositor
                              fields:
                                account: "first(depositor.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 20)"
                                amount: {dist: lognormal, params: {mu: "ln(480) - 0.5 * params.check_small", sigma: 0.1}, heaping: {share: 1.0, units: {"20": 1.0}}, clip: [20, 500]}
                                channel: "'atm'"
                                card: "first(first(depositor.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 20).cards, where=it.status == 'active')"
                        else:
                          - emit:
                              event: p2p_send
                              actor: depositor
                              fields:
                                account: "first(depositor.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 20)"
                                payee: friend
                                amount:
                                  dist: lognormal
                                  params:
                                    mu: >-
                                      ln(max(20, 0.9 * first(depositor.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 20).balance))
                                      - params.check_small
                                    sigma: "0.1 + 0.4 * params.check_small"
                                  clip: [1, params.p2p_limit]
                                  round: 2
                                device: first(depositor.devices, by=it.created_at)
                                ip: "depositor.vpn_exit if depositor.vpn_user else first(depositor.household.networks)"
            transitions:
              - {to: done, when: "depositor.restricted or depositor.status == 'closed'"}
              - {to: withdraw, hazard: {per_day: "6.0 * (1 - 0.5 * params.check_small)"}}
              - {to: done, hazard: {per_day: "0.8 * (1 - 0.5 * params.check_small)"}}
          done: {terminal: true}

    false_chargeback:
      family: first_party
      label: fraud
      anchor: buyer
      roles:
        buyer:
          entity: person
          select:
            where: "self.status == 'active' and count(self.cards, where=it.status == 'active') > 0"
            odds: "exp(2.0 * self.financial_stress + (0.5 if self.age < 35 else 0.0))"
        store:
          entity: merchant
          select: {where: "self.category in ('online_retail', 'electronics')", odds: self.popularity}
        shop:
          entity: merchant
          select: {where: "count(buyer.shops_at, where=it == self) > 0"}
        kit:
          entity: claim_plan
          create: true
      prevalence:
        rate_per_year: params.chargeback_rate
        # Advice on how to get a refund and keep the goods spreads online, in waves.
        campaigns: {waves_per_year: 2, multiplier: 3, duration: 21d}
      look_alikes: [genuine_dispute, big_online_purchase]
      difficulty: [chargeback_blend]
      steps:
        initial: buy
        states:
          buy:
            # A purchase made to be disputed: online, at a store, or with `chargeback_blend` at one of the buyer's
            # own shops at the buyer's own amounts.
            enter:
              - if:
                  when: "count(buyer.cards, where=it.status == 'active') > 0"
                  then:
                    - chance:
                        probability: params.chargeback_blend
                        then:
                          - set: {kit.stealth: "true"}
                          - chance:
                              probability: shop.ecommerce_share
                              then:
                                - emit:
                                    event: card_purchase
                                    actor: buyer
                                    fields:
                                      card: {pick: buyer.cards, where: "it.status == 'active'"}
                                      merchant: shop
                                      amount: {dist: lognormal, params: {mu: shop.amount_mu, sigma: shop.amount_sigma}, clip: [0.5, 5000]}
                                      channel: "'ecommerce'"
                                      device: first(buyer.devices, by=it.created_at)
                                      ip: "buyer.vpn_exit if buyer.vpn_user else first(buyer.household.networks)"
                              else:
                                - emit:
                                    event: card_purchase
                                    actor: buyer
                                    fields:
                                      card: {pick: buyer.cards, where: "it.status == 'active'"}
                                      merchant: shop
                                      amount: {dist: lognormal, params: {mu: shop.amount_mu, sigma: shop.amount_sigma}, clip: [0.5, 5000]}
                                      channel: "'card_present'"
                        else:
                          - set: {kit.stealth: "false"}
                          - emit:
                              event: card_purchase
                              actor: buyer
                              fields:
                                card: {pick: buyer.cards, where: "it.status == 'active'"}
                                merchant: store
                                amount: {dist: lognormal, params: {mu: "ln(250)", sigma: 0.6}, heaping: {share: 0.4, units: {"10": 0.5, "50": 0.5}}, clip: [20, 3000]}
                                channel: "'ecommerce'"
                                device: first(buyer.devices, by=it.created_at)
                                ip: "buyer.vpn_exit if buyer.vpn_user else first(buyer.household.networks)"
            transitions:
              - {to: wait, on_event: {event: card_purchase, outcome: approve}}
              - {to: done, on_event: {event: card_purchase, outcome: [decline, step_up, insufficient_funds, card_inactive, restricted]}}
              - {to: done, after: 1d}
          wait:
            # The goods arrive. Weeks later the buyer says they didn't, or that the payment wasn't theirs.
            transitions:
              - {to: claim, hazard: {per_day: "0.058 if kit.stealth else 0.028"}}
          claim:
            enter:
              - label:
                  name: false_chargeback
                  subject: buyer
                  knowable_after: {d: {p50: 45, p95: 90}}
                  discovery:
                    probability: 0.35
                    after: {d: {p50: 50, p95: 120}}
                    channels: {merchant_representment: 0.7, analyst: 0.3}
              - if:
                  when: "count(buyer.history('card_purchase', '90d'), where=it.actor == buyer and it.outcome == 'approve' and it.merchant == (shop if kit.stealth else store)) > 0"
                  then:
                    # With `chargeback_blend`, the reasons of honest disputes.
                    - if:
                        when: kit.stealth
                        then:
                          - emit:
                              event: dispute
                              actor: buyer
                              fields:
                                card: "last(buyer.history('card_purchase', '90d'), where=it.actor == buyer and it.outcome == 'approve' and it.merchant == (shop if kit.stealth else store), by=it.time).card"
                                merchant: "shop if kit.stealth else store"
                                amount: "last(buyer.history('card_purchase', '90d'), where=it.actor == buyer and it.outcome == 'approve' and it.merchant == (shop if kit.stealth else store), by=it.time).amount"
                                reason: {shares: {not_received: 0.45, not_as_described: 0.4, fraud: 0.15}}
                        else:
                          - emit:
                              event: dispute
                              actor: buyer
                              fields:
                                card: "last(buyer.history('card_purchase', '90d'), where=it.actor == buyer and it.outcome == 'approve' and it.merchant == (shop if kit.stealth else store), by=it.time).card"
                                merchant: "shop if kit.stealth else store"
                                amount: "last(buyer.history('card_purchase', '90d'), where=it.actor == buyer and it.outcome == 'approve' and it.merchant == (shop if kit.stealth else store), by=it.time).amount"
                                reason: {shares: {not_received: 0.6, fraud: 0.4}}
            transitions:
              - {to: buy, hazard: {per_day: 0.01}}
              - {to: done, hazard: {per_day: 0.02}}
          done: {terminal: true}

    structuring:
      family: structuring
      label: laundering
      anchor: depositor
      roles:
        depositor:
          entity: person
          select:
            where: "self.status == 'active' and self.age >= 21 and not self.synthetic"
            odds: "exp(1.5 if self.cash_earner else 0.0)"
      prevalence:
        rate_per_year: params.structuring_rate
        # Cash from a ring's sales arrives in waves.
        campaigns: {waves_per_year: 3, multiplier: 3, duration: 21d}
      look_alikes: [cash_income, large_cash_deposit]
      difficulty: [structuring_small, structuring_spread]
      steps:
        initial: start
        states:
          start:
            enter:
              - label:
                  name: structuring
                  subject: depositor
                  knowable_after: {d: {p50: 30, p95: 120}}
                  discovery:
                    probability: 0.35
                    after: {d: {p50: 45, p95: 150}}
                    channels: {analyst: 0.8, law_enforcement: 0.2}
            transitions:
              - {to: deposit, after: {h: {p50: 6, p95: 48}}}
          deposit:
            # Cash under the $10,000 reporting threshold, at any branch; with `structuring_small`, more often at the
            # depositor's own branch, as a cash earner deposits.
            enter:
              - if:
                  when: "count(depositor.accounts, where=it.status == 'open') > 0"
                  then:
                    - chance:
                        probability: "params.structuring_small / 2.7"
                        then:
                          - emit:
                              event: cash_deposit
                              actor: depositor
                              fields:
                                account:
                                  pick: depositor.accounts
                                  where: "it.status == 'open'"
                                  weight: "1.0 if it.type == 'checking' else 0.01 + params.structuring_spread"
                                amount:
                                  dist: lognormal
                                  params: {mu: "ln(9100) - params.structuring_small", sigma: "0.05 + 0.3 * params.structuring_small"}
                                  heaping: {share: 0.7, units: {"20": 0.5, "100": 0.5}}
                                  clip: [20, 9900]
                                branch:
                                  mixture:
                                    - {weight: 0.85, value: depositor.home_branch}
                                    - {weight: 0.15, value: {shares: {central: 0.2, north: 0.15, south: 0.15, east: 0.1, west: 0.1, mall: 0.1, airport: 0.05, downtown: 0.15}}}
                        else:
                          - emit:
                              event: cash_deposit
                              actor: depositor
                              fields:
                                account:
                                  pick: depositor.accounts
                                  where: "it.status == 'open'"
                                  weight: "1.0 if it.type == 'checking' else 0.01 + params.structuring_spread"
                                amount:
                                  dist: lognormal
                                  params: {mu: "ln(9100) - params.structuring_small", sigma: "0.05 + 0.3 * params.structuring_small"}
                                  heaping: {share: 0.7, units: {"20": 0.5, "100": 0.5}}
                                  clip: [20, 9900]
                                branch: {shares: {central: 0.125, north: 0.125, south: 0.125, east: 0.125, west: 0.125, mall: 0.125, airport: 0.125, downtown: 0.125}}
            transitions:
              - {to: done, when: "depositor.restricted or depositor.status == 'closed'"}
              - {to: deposit, hazard: {per_day: "1.2 * (1 + params.structuring_small) * (1 - 0.6 * params.structuring_spread)"}}
              - {to: send_on, hazard: {per_day: "0.15 * (1 - 0.6 * params.structuring_spread)"}}
          send_on:
            # The money leaves by wire, to an exchange.
            enter:
              - if:
                  when: "count(depositor.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 1000) > 0"
                  then:
                    - emit:
                        event: wire_out
                        actor: depositor
                        after: {h: {p50: 20, p95: 72}}
                        fields:
                          account: "last(depositor.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 1000, by=it.balance)"
                          amount: "round(0.85 * last(depositor.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 1000, by=it.balance).balance, 2)"
            transitions:
              - {to: deposit, hazard: {per_day: 0.05}}
              - {to: done, hazard: {per_day: 0.1}}
          done: {terminal: true}

    merchant_bust_out:
      family: merchant_bust_out
      label: fraud
      anchor: business
      roles:
        business:
          entity: business
          select:
            where: "self.status == 'open'"
            odds: "exp(2.0 * self.owner.financial_stress)"
        crew:
          entity: fraudster
          select: {odds: "1 + self.skill"}
      prevalence:
        rate_per_year: params.merchant_bustout_rate
        campaigns: {waves_per_year: 2, multiplier: 3, duration: 30d}
      look_alikes: [daily_settlement, business_chargebacks, business_expenses, owner_withdrawal]
      difficulty: [bustout_ramp, bustout_drain]
      steps:
        initial: ramp
        states:
          ramp:
            # Card volume jumps: stolen cards, and sales that never happened.
            enter:
              - label:
                  name: merchant_bust_out
                  subject: business
                  knowable_after: {d: {p50: 35, p95: 75}}
                  discovery:
                    probability: 0.75
                    after: {d: {p50: 40, p95: 90}}
                    channels: {chargeback: 0.8, analyst: 0.2}
            transitions:
              - {to: fake_sales, after: 1h}
          fake_sales:
            enter:
              - emit:
                  event: card_settlement
                  actor: crew
                  fields:
                    business: business
                    amount: {dist: lognormal, params: {mu: "ln(business.sales_daily * (5.0 - 3.5 * params.bustout_ramp))", sigma: 0.35}, round: 2}
              # What landed before goes out as it lands.
              - if:
                  when: "business.balance > 1000"
                  then:
                    - chance:
                        probability: params.bustout_drain
                        then:
                          - emit:
                              event: business_payout
                              actor: crew
                              after: {h: {p50: 3, p95: 8}}
                              fields:
                                business: business
                                amount: {dist: lognormal, params: {mu: "ln(business.sales_daily * 2.0)", sigma: 0.4}, round: 2}
                                kind: "'supplier'"
                        else:
                          - emit:
                              event: business_payout
                              actor: crew
                              after: {h: {p50: 3, p95: 8}}
                              fields:
                                business: business
                                amount: "round(0.9 * business.balance, 2)"
                                kind: "'owner_draw'"
            transitions:
              - {to: stopped, on_event: {event: business_payout, outcome: hold}}
              - {to: fake_sales, after: {h: {p50: 24, p95: 30}}}
              - {to: vanish, hazard: {per_day: 0.06}}
          vanish:
            enter:
              - if:
                  when: "business.balance > 100"
                  then:
                    - emit:
                        event: business_payout
                        actor: crew
                        fields:
                          business: business
                          amount: "round(business.balance - 50, 2)"
                          kind: "'owner_draw'"
              - set: {business.status: "'closed'"}
            transitions:
              - {to: chargebacks, after: {d: {p50: 10, p95: 25}}}
          stopped:
            # The bank held a payout and called the owner: the crew leaves what is still in the account.
            enter:
              - set: {business.status: "'closed'"}
            transitions:
              - {to: chargebacks, after: {d: {p50: 10, p95: 25}}}
          chargebacks:
            # The cardholders' disputes come back for weeks, more than the account holds.
            enter:
              - emit:
                  event: business_chargeback
                  actor: crew
                  fields:
                    business: business
                    amount: {dist: lognormal, params: {mu: "ln(business.sales_daily * (5.0 - 3.5 * params.bustout_ramp) * 0.5)", sigma: 0.5}, round: 2}
            transitions:
              - {to: chargebacks, after: {d: {p50: 2, p95: 6}}}
              - {to: done, hazard: {per_day: 0.04}}
          done: {terminal: true}

    elder_abuse:
      family: elder_abuse
      label: fraud
      anchor: elder
      roles:
        elder:
          entity: person
          select:
            where: "self.age >= 60 and self.status == 'active'"
            odds: "exp(2.5 * self.isolation + (0.8 if self.age >= 80 else 0.0))"
        abuser:
          description: A relative or a caregiver, who banks elsewhere and is paid by P2P.
          entity: counterparty
          select: {where: "self.kind == 'person'"}
      prevalence:
        rate_per_year: params.elder_abuse_rate
        campaigns: {waves_per_year: 2, multiplier: 1.5, duration: 30d}
      look_alikes: [caregiver_payment, p2p_contact, atm_cash]
      difficulty: [elder_slow]
      steps:
        initial: trust
        states:
          trust:
            transitions:
              - {to: take_over, after: {d: {p50: 7, p95: 30}}}
          take_over:
            # Family or adult protective services find out late, if at all.
            enter:
              - label:
                  name: elder_abuse
                  subject: elder
                  knowable_after: {d: {p50: 150, p95: 400}}
                  discovery:
                    probability: 0.3
                    after: {d: {p50: 200, p95: 450}}
                    channels: {family: 0.5, adult_protective_services: 0.3, analyst: 0.2}
              - chance:
                  probability: 0.3
                  then:
                    - if:
                        when: "count(elder.accounts) > 0"
                        then:
                          - emit:
                              event: profile_change
                              actor: abuser
                              fields:
                                person: elder
                                institution: first(elder.accounts).institution
                                field_changed: "'phone'"
                                device: first(elder.devices, by=it.created_at)
            transitions:
              - {to: take, after: {h: {p50: 6, p95: 48}}}
          take:
            # Cash from ATMs with the elder's card, and P2P payments to the abuser from the elder's phone.
            enter:
              - if:
                  when: "count(elder.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 40) > 0"
                  then:
                    - chance:
                        probability: 0.5
                        then:
                          - emit:
                              event: cash_withdrawal
                              actor: abuser
                              fields:
                                account: "first(elder.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 40)"
                                amount: {dist: lognormal, params: {mu: "ln(300) - params.elder_slow", sigma: 0.4}, heaping: {share: 1.0, units: {"20": 1.0}}, clip: [20, 800]}
                                channel: "'atm'"
                                card: "first(first(elder.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 40).cards, where=it.status == 'active')"
                        else:
                          - emit:
                              event: p2p_send
                              actor: abuser
                              fields:
                                account: "first(elder.accounts, where=it.type == 'checking' and it.status == 'open' and it.balance > 40)"
                                payee: abuser
                                amount: {dist: lognormal, params: {mu: "ln(450) - params.elder_slow", sigma: 0.6}, heaping: {share: 0.5, units: {"50": 0.5, "100": 0.5}}, clip: [10, 5000]}
                                device: first(elder.devices, by=it.created_at)
                                ip: "elder.vpn_exit if elder.vpn_user else first(elder.household.networks)"
            transitions:
              - {to: done, when: "elder.restricted or elder.status == 'closed'"}
              - {to: done, on_event: {event: p2p_send, outcome: [hold, block]}}
              - {to: take, hazard: {per_day: "0.35 * (1 - 0.6 * params.elder_slow)"}}
              - {to: done, hazard: {per_day: 0.01}}
          done: {terminal: true}

    laundering:
      family: laundering
      label: laundering
      anchor: launderer
      roles:
        launderer:
          description: An ordinary customer with a job, and often a business, who launders an organization's cash.
          entity: person
          select:
            where: "self.status == 'active' and self.age >= 25 and not self.synthetic and count(self.accounts, where=it.status == 'open') >= 2"
            odds: "exp(1.5 if self.business_owner else 0.0)"
        organization:
          entity: fraudster
          select: {odds: "1 + self.skill"}
        layer_account:
          description: An account outside the world that money passes through and comes back from.
          entity: counterparty
          select: {where: "self.kind == 'mule'"}
      prevalence:
        rate_per_year: params.laundering_rate
        campaigns: {waves_per_year: 4, multiplier: 1.5, duration: 14d}
      look_alikes: [own_transfer, large_cash_deposit, cash_income, crypto_buy, marketplace_sale]
      difficulty: [laundering_small]
      steps:
        initial: start
        states:
          start:
            enter:
              - label:
                  name: laundering
                  subject: launderer
                  knowable_after: {d: {p50: 120, p95: 365}}
                  discovery:
                    probability: 0.2
                    after: {d: {p50: 150, p95: 400}}
                    channels: {analyst: 0.5, law_enforcement: 0.5}
            transitions:
              - {to: place, after: {d: {p50: 2, p95: 10}}}
          place:
            # Placement: the organization's cash into the launderer's accounts, at one bank or at two.
            enter:
              - emit:
                  event: cash_deposit
                  actor: launderer
                  fields:
                    account: {pick: launderer.accounts, where: "it.status == 'open'"}
                    amount:
                      dist: lognormal
                      params: {mu: "ln(4000) - params.laundering_small", sigma: "0.5 + 0.2 * params.laundering_small"}
                      heaping: {share: 0.6, units: {"20": 0.5, "100": 0.5}}
                      clip: [20, 9900]
                    branch:
                      mixture:
                        - {weight: 0.6, value: launderer.home_branch}
                        - {weight: 0.4, value: {shares: {central: 0.2, north: 0.15, south: 0.15, east: 0.1, west: 0.1, mall: 0.1, airport: 0.05, downtown: 0.15}}}
            transitions:
              - {to: done, when: "launderer.restricted or launderer.status == 'closed' or count(launderer.accounts, where=it.status == 'open') < 2"}
              - {to: place, hazard: {per_day: 0.7}}
              - {to: layer, hazard: {per_day: 0.25}}
              - {to: done, hazard: {per_day: 0.02}}
          layer:
            # Layering: between the launderer's own accounts, and out through an outside account and back.
            enter:
              - if:
                  when: "last(launderer.accounts, where=it.status == 'open', by=it.balance).balance > 200"
                  then:
                    - chance:
                        probability: 0.5
                        then:
                          - emit:
                              event: transfer_internal
                              actor: launderer
                              fields:
                                from_account: "last(launderer.accounts, where=it.status == 'open', by=it.balance)"
                                to_account: {pick: launderer.accounts, where: "it.status == 'open' and it != last(launderer.accounts, where=it.status == 'open', by=it.balance)"}
                                amount:
                                  dist: lognormal
                                  params:
                                    mu: "(1 - params.laundering_small / 1.5) * ln(max(50, 0.7 * last(launderer.accounts, where=it.status == 'open', by=it.balance).balance)) + params.laundering_small / 1.5 * ln(300)"
                                    sigma: "0.1 + 0.6 * params.laundering_small"
                                  clip: [10, 20000]
                                  round: 2
                        else:
                          - emit:
                              event: p2p_send
                              actor: launderer
                              fields:
                                account: "last(launderer.accounts, where=it.status == 'open', by=it.balance)"
                                payee: layer_account
                                amount:
                                  dist: lognormal
                                  params:
                                    mu: "(1 - params.laundering_small / 1.5) * ln(max(50, 0.6 * last(launderer.accounts, where=it.status == 'open', by=it.balance).balance)) + params.laundering_small / 1.5 * ln(90)"
                                    sigma: "0.1 + 0.67 * params.laundering_small"
                                  clip: [1, params.p2p_limit]
                                  round: 2
                                device: first(launderer.devices, by=it.created_at)
                                ip: "launderer.vpn_exit if launderer.vpn_user else first(launderer.household.networks)"
                          - emit:
                              event: p2p_receive
                              actor: organization
                              after: {h: {p50: 20, p95: 72}}
                              fields:
                                account: {pick: launderer.accounts, where: "it.status == 'open'"}
                                sender: layer_account
                                amount:
                                  dist: lognormal
                                  params: {mu: "(1 - params.laundering_small / 1.5) * ln(1500) + params.laundering_small / 1.5 * ln(90)", sigma: "0.5 + 0.4 * params.laundering_small"}
                                  heaping: {share: 0.4, units: {"5": 0.4, "10": 0.4, "20": 0.2}}
                                  clip: [1, 5000]
            transitions:
              - {to: done, when: "launderer.restricted or launderer.status == 'closed' or count(launderer.accounts, where=it.status == 'open') < 2"}
              - {to: layer, hazard: {per_day: 0.5}}
              - {to: integrate, hazard: {per_day: 0.15}}
              - {to: done, hazard: {per_day: 0.02}}
          integrate:
            # Integration: the business's takings, or a large purchase. The launderer's own spending carries the
            # dirty share too.
            enter:
              - if:
                  when: "count(launderer.businesses, where=it.status == 'open') > 0"
                  then:
                    - emit:
                        event: card_settlement
                        actor: organization
                        fields:
                          business: "first(launderer.businesses, where=it.status == 'open')"
                          amount: {dist: lognormal, params: {mu: "ln(first(launderer.businesses, where=it.status == 'open').sales_daily) + 0.4 - 0.4 * params.laundering_small", sigma: 0.35}, round: 2}
                  else:
                    - if:
                        when: "count(launderer.cards, where=it.status == 'active') > 0"
                        then:
                          - emit:
                              event: card_purchase
                              actor: launderer
                              fields:
                                card: {pick: launderer.cards, where: "it.status == 'active'"}
                                merchant:
                                  pick: "entities('merchant')"
                                  where: "it.category in ('travel', 'electronics', 'online_retail')"
                                  weight: it.popularity
                                amount:
                                  dist: lognormal
                                  params: {mu: "ln(900) - params.laundering_small", sigma: 0.6}
                                  heaping: {share: 0.5, units: {"10": 0.5, "50": 0.5}}
                                  clip: [5, 5000]
                                channel: "'ecommerce'"
                                device: first(launderer.devices, by=it.created_at)
                                ip: "launderer.vpn_exit if launderer.vpn_user else first(launderer.household.networks)"
            transitions:
              - {to: done, when: "launderer.restricted or launderer.status == 'closed'"}
              - {to: integrate, hazard: {per_day: 0.3}}
              - {to: place, hazard: {per_day: 0.05}}
              - {to: done, hazard: {per_day: 0.06}}
          done: {terminal: true}

observers:
  demo_bank:
    institution: demo_bank
    visibility: institution
    ids:
      person: {generator: sequential, start: 100001}
      card: {generator: random_numeric, length: 15, checksum: luhn}
      device: {generator: random_alnum, length: 16}
      card_purchase: {generator: random_alnum, length: 12}
      login: {generator: uuid}
      counterparty: {generator: random_alnum, length: 10, prefix: "P2P-"}
      p2p_send: {generator: random_alnum, length: 14}
      p2p_receive: {generator: random_alnum, length: 14}
      wire_out: {generator: random_numeric, length: 12}
      account: {generator: random_numeric, length: 10}
      business: {generator: random_alnum, length: 8, prefix: "B-"}
      cash_deposit: {generator: random_alnum, length: 14}
      cash_withdrawal: {generator: random_alnum, length: 14}
      check_deposit: {generator: random_numeric, length: 12}
      dispute: {generator: random_alnum, length: 10, prefix: "D-"}
      card_settlement: {generator: random_alnum, length: 14}
      transfer_internal: {generator: random_alnum, length: 14}
    tables: &bank_tables
      CUSTOMER:
        description: One row per customer, kept current.
        kind: entity_state
        grain: {entity: person}
        keys: {primary: [CUST_ID]}
        arrival: {cadence: daily, at: "02:00", mode: upsert}
        columns:
          CUST_ID: {storage: string, logical: identifier, sensitivity: direct_identifier, source: {kind: key, of: person}}
          AGE: {storage: integer, logical: number, sensitivity: quasi_identifier, source: {kind: attribute, of: person.age}}
          REGION:
            storage: string
            logical: region
            sensitivity: quasi_identifier
            source: {kind: attribute, of: household.region, transforms: [upper]}
          STATUS: {storage: string, logical: status, sensitivity: internal, source: {kind: attribute, of: person.status}}
          RESTRICTED_FLG:
            storage: string
            logical: flag
            sensitivity: internal
            source: {kind: attribute, of: person.restricted, map: {"true": "Y", "false": "N"}}
      CARD_TXN:
        description: Card authorizations, one row per authorization request.
        kind: event
        grain: {event: card_purchase}
        keys:
          primary: [AUTH_ID]
          foreign:
            - {columns: [CUST_ID], table: CUSTOMER, to: [CUST_ID]}
        arrival: {cadence: hourly, latency: {m: {p50: 40, p95: 90}}, mode: append, late_share: 0.002}
        quirks:
          - {id: auth_duplicates, kind: duplicates, share: 0.0005, evidence: {method: assumed}}
        columns:
          AUTH_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key, of: card_purchase}}
          CARD_ID:
            storage: string
            logical: identifier
            sensitivity: direct_identifier
            source: {kind: event_field, of: card_purchase.card}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: card.holder}}
          AUTH_TS:
            storage: timestamp
            logical: datetime
            sensitivity: internal
            representation: {precision: s, time_zone: utc}
            source: {kind: event_time, of: card_purchase}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: card_purchase.amount}}
          MCC_CAT: {storage: string, logical: code, sensitivity: internal, source: {kind: attribute, of: merchant.category}}
          CHANNEL: {storage: string, logical: code, sensitivity: internal, source: {kind: event_field, of: card_purchase.channel}}
          IP_RISK: {storage: decimal, logical: score, sensitivity: internal, source: {kind: event_field, of: card_purchase.ip_risk}}
          RESP_CD:
            storage: string
            logical: code
            sensitivity: internal
            source:
              kind: event_field
              of: card_purchase.outcome
              map: {approve: "00", decline: "05", step_up: "1A", insufficient_funds: "51", card_inactive: "14",
                    restricted: "62"}
      LOGIN_EVT:
        description: Online banking logins.
        kind: event
        grain: {event: login}
        keys: {primary: [LOGIN_ID]}
        arrival: {cadence: realtime, mode: append}
        columns:
          LOGIN_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key, of: login}}
          CUST_ID: {storage: string, logical: identifier, sensitivity: direct_identifier, source: {kind: event_field, of: login.person}}
          LOGIN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time, of: login}}
          DEVICE_ID: {storage: string, logical: device_id, sensitivity: internal, source: {kind: event_field, of: login.device}}
          PLATFORM: {storage: string, logical: code, sensitivity: internal, source: {kind: attribute, of: device.platform}}
          LOAD_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: load_time}}
          IP_RISK: {storage: decimal, logical: score, sensitivity: internal, source: {kind: event_field, of: login.ip_risk}}
          DEVICE_RISK: {storage: decimal, logical: score, sensitivity: internal, source: {kind: event_field, of: login.device_risk}}
          RESULT:
            storage: string
            logical: code
            sensitivity: internal
            source:
              kind: event_field
              of: login.outcome
              map: {allow: OK, step_up: MFA, block: BLOCKED, failed: BAD_PW}
        quirks:
          - {id: platform_unknown, kind: placeholder_value, columns: [PLATFORM], value: UNKNOWN, share: 0.01,
             evidence: {method: assumed}}
      P2P_TXN:
        description: P2P payments that customers send and receive, one row per payment.
        kind: event
        grain: {events: [p2p_send, p2p_receive]}
        keys: {primary: [P2P_ID]}
        arrival: {cadence: hourly, latency: {m: {p50: 20, p95: 60}}, mode: append}
        columns:
          P2P_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: account.holder}}
          DIRECTION:
            storage: string
            logical: code
            sensitivity: internal
            source: {kind: event_field, of: "*.type", map: {p2p_send: OUT, p2p_receive: IN}}
          PAYEE_ID: {storage: string, logical: identifier, sensitivity: direct_identifier, source: {kind: event_field, of: p2p_send.payee}}
          SENDER_ID: {storage: string, logical: identifier, sensitivity: direct_identifier, source: {kind: event_field, of: p2p_receive.sender}}
          SENDER_CUST: {storage: string, logical: identifier, sensitivity: direct_identifier, source: {kind: event_field, of: p2p_receive.sender_person}}
          TXN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: "*.amount"}}
          IP_RISK: {storage: decimal, logical: score, sensitivity: internal, source: {kind: event_field, of: p2p_send.ip_risk}}
          STATUS:
            storage: string
            logical: code
            sensitivity: internal
            source:
              kind: event_field
              of: "*.outcome"
              map: {release: SENT, hold: HELD, block: BLOCKED, not_open: CLOSED, restricted: RESTRICTED,
                    insufficient_funds: NSF, ok: RECEIVED, returned: RETURNED}
      WIRE_TXN:
        description: Outgoing wires, one row per wire.
        kind: event
        grain: {event: wire_out}
        keys: {primary: [WIRE_ID]}
        arrival: {cadence: daily, at: "03:00", mode: append}
        columns:
          WIRE_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: account.holder}}
          WIRE_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: wire_out.amount}}
          STATUS:
            storage: string
            logical: code
            sensitivity: internal
            source: {kind: event_field, of: wire_out.outcome, map: {ok: SENT, not_open: CLOSED, insufficient_funds: NSF}}

      ACCOUNT:
        description: One row per account, kept current.
        kind: entity_state
        grain: {entity: account}
        keys: {primary: [ACCT_ID]}
        arrival: {cadence: daily, at: "02:00", mode: upsert}
        columns:
          ACCT_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key, of: account}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: account.holder}}
          TYPE: {storage: string, logical: code, sensitivity: internal, source: {kind: attribute, of: account.type}}
          STATUS: {storage: string, logical: status, sensitivity: internal, source: {kind: attribute, of: account.status}}
          CREDIT_LINE: {storage: decimal, logical: amount, sensitivity: internal, source: {kind: attribute, of: account.credit_line}}
          BALANCE: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: attribute, of: account.balance}}
      CASH_DEPOSIT:
        description: Cash deposits at the bank's branches.
        kind: event
        grain: {event: cash_deposit}
        keys: {primary: [CASH_ID]}
        arrival: {cadence: daily, at: "04:00", mode: append}
        columns:
          CASH_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: account.holder}}
          TXN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: cash_deposit.amount}}
          BRANCH: {storage: string, logical: code, sensitivity: internal, source: {kind: event_field, of: cash_deposit.branch, transforms: [upper]}}
          STATUS: {storage: string, logical: code, sensitivity: internal, source: {kind: event_field, of: cash_deposit.outcome, map: {ok: POSTED, not_open: CLOSED}}}
      CASH_WITHDRAWAL:
        description: Cash withdrawals at ATMs and branches.
        kind: event
        grain: {event: cash_withdrawal}
        keys: {primary: [CASH_ID]}
        arrival: {cadence: daily, at: "04:00", mode: append}
        columns:
          CASH_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: account.holder}}
          TXN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: cash_withdrawal.amount}}
          CHANNEL: {storage: string, logical: code, sensitivity: internal, source: {kind: event_field, of: cash_withdrawal.channel}}
          STATUS:
            storage: string
            logical: code
            sensitivity: internal
            source:
              kind: event_field
              of: cash_withdrawal.outcome
              map: {ok: POSTED, not_open: CLOSED, restricted: RESTRICTED, insufficient_funds: NSF}
      CHECK_TXN:
        description: Check deposits, the release of held funds, and returned checks.
        kind: event
        grain: {events: [check_deposit, deposit_available, check_return]}
        keys: {primary: [CHECK_ID]}
        arrival: {cadence: daily, at: "04:00", mode: append}
        columns:
          CHECK_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: account.holder}}
          TXN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          TYPE:
            storage: string
            logical: code
            sensitivity: internal
            source: {kind: event_field, of: "*.type", map: {check_deposit: DEPOSIT, deposit_available: FUNDS_RELEASED, check_return: RETURNED}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: "*.amount"}}
          CHANNEL: {storage: string, logical: code, sensitivity: internal, source: {kind: event_field, of: check_deposit.channel}}
          STATUS:
            storage: string
            logical: code
            sensitivity: internal
            source:
              kind: event_field
              of: "*.outcome"
              map: {release: AVAILABLE, hold: HELD, reject: REJECTED, not_open: CLOSED, ok: POSTED, returned: NOT_PAID}
      DISPUTE:
        description: Card disputes as customers open them.
        kind: event
        grain: {event: dispute}
        keys: {primary: [DISPUTE_ID]}
        arrival: {cadence: daily, at: "05:00", mode: append}
        columns:
          DISPUTE_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: card.holder}}
          CARD_ID: {storage: string, logical: identifier, sensitivity: direct_identifier, source: {kind: event_field, of: dispute.card}}
          TXN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: dispute.amount}}
          MCC_CAT: {storage: string, logical: code, sensitivity: internal, source: {kind: attribute, of: merchant.category}}
          REASON: {storage: string, logical: code, sensitivity: internal, source: {kind: event_field, of: dispute.reason}}
      DISPUTE_RESULT:
        description: The merchants' answers to disputes.
        kind: event
        grain: {event: dispute_decided}
        keys: {primary: [RESULT_ID]}
        arrival: {cadence: daily, at: "05:00", mode: append}
        columns:
          RESULT_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: card.holder}}
          CARD_ID: {storage: string, logical: identifier, sensitivity: direct_identifier, source: {kind: event_field, of: dispute_decided.card}}
          TXN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: dispute_decided.amount}}
          MERCHANT_WON:
            storage: string
            logical: flag
            sensitivity: internal
            source: {kind: event_field, of: dispute_decided.merchant_wins, map: {"true": "Y", "false": "N"}}
      BUSINESS_TXN:
        description: The card settlements, chargebacks and payouts of the bank's business customers.
        kind: event
        grain: {events: [card_settlement, business_chargeback, business_payout]}
        keys: {primary: [BTXN_ID]}
        arrival: {cadence: daily, at: "04:00", mode: append}
        columns:
          BTXN_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          BIZ_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: event_field, of: "*.business"}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: attribute, of: business.owner}}
          BIZ_KIND: {storage: string, logical: code, sensitivity: internal, source: {kind: attribute, of: business.kind}}
          TXN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          TYPE:
            storage: string
            logical: code
            sensitivity: internal
            source: {kind: event_field, of: "*.type", map: {card_settlement: SETTLEMENT, business_chargeback: CHARGEBACK, business_payout: PAYOUT}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: "*.amount"}}
          PAYOUT_KIND: {storage: string, logical: code, sensitivity: internal, source: {kind: event_field, of: business_payout.kind}}
          STATUS:
            storage: string
            logical: code
            sensitivity: internal
            source:
              kind: event_field
              of: "*.outcome"
              map: {ok: POSTED, closed: CLOSED, release: SENT, hold: HELD, insufficient_funds: NSF}
      TRANSFER_TXN:
        description: Transfers between a customer's own accounts, at this bank or with another.
        kind: event
        grain: {event: transfer_internal}
        keys: {primary: [XFER_ID]}
        arrival: {cadence: daily, at: "04:00", mode: append}
        columns:
          XFER_ID: {storage: string, logical: identifier, sensitivity: internal, source: {kind: key}}
          CUST_ID: {storage: string, logical: foreign_key, sensitivity: direct_identifier, source: {kind: event_field, of: transfer_internal.actor}}
          FROM_ACCT: {storage: string, logical: identifier, sensitivity: internal, source: {kind: event_field, of: transfer_internal.from_account}}
          TO_ACCT: {storage: string, logical: identifier, sensitivity: internal, source: {kind: event_field, of: transfer_internal.to_account}}
          TXN_TS: {storage: timestamp, logical: datetime, sensitivity: internal, source: {kind: event_time}}
          AMT: {storage: decimal, logical: amount, sensitivity: sensitive_attribute, source: {kind: event_field, of: transfer_internal.amount}}
          STATUS:
            storage: string
            logical: code
            sensitivity: internal
            source: {kind: event_field, of: transfer_internal.outcome, map: {ok: POSTED, not_open: CLOSED, insufficient_funds: NSF}}
  # The second observed bank keeps the same tables of its own customers, with ids of its own.
  metro_bank:
    institution: metro_bank
    visibility: institution
    ids:
      person: {generator: sequential, start: 700001}
      card: {generator: random_numeric, length: 16, checksum: luhn}
      device: {generator: random_alnum, length: 20}
      card_purchase: {generator: random_alnum, length: 16}
      login: {generator: random_alnum, length: 24}
      counterparty: {generator: random_alnum, length: 8, prefix: "ZP-"}
      p2p_send: {generator: random_alnum, length: 12}
      p2p_receive: {generator: random_alnum, length: 12}
      wire_out: {generator: random_numeric, length: 10}
      account: {generator: random_numeric, length: 12}
      business: {generator: random_alnum, length: 10, prefix: "M-"}
      cash_deposit: {generator: random_alnum, length: 12}
      cash_withdrawal: {generator: random_alnum, length: 12}
      check_deposit: {generator: random_numeric, length: 10}
      dispute: {generator: random_alnum, length: 8, prefix: "CB-"}
      card_settlement: {generator: random_alnum, length: 12}
      transfer_internal: {generator: random_alnum, length: 12}
    tables: *bank_tables

env:
  roles:
    defender: {institution: demo_bank, default_policy: demo_bank_rules}
    analyst: {institution: demo_bank, capacity: {reviews_per_day: 25}, default_policy: analyst_rules}
    adversary: {scenarios: [account_takeover], default_policy: ato_script}
    aml_analyst: {institution: demo_bank, capacity: {reviews_per_day: 10}, default_policy: aml_rules}
    metro_defender: {institution: metro_bank, default_policy: metro_rules}

  policies:
    demo_bank_rules:
      kind: rules
      rules:
        - {decision: card_auth, when: "obs.ecommerce and obs.amount > 1500", action: decline}
        - {decision: card_auth, when: "obs.ecommerce and obs.new_device and obs.amount > 300", action: step_up}
        - {decision: card_auth, action: approve}
        - {decision: login_check, when: "obs.device_risk > 0.8 and obs.ip_risk > 0.7", action: step_up}
        - {decision: login_check, action: allow}
        - {decision: txn_monitoring, when: "obs.ecommerce and obs.amount > 500 and obs.contact_changed_7d", action: raise_alert}
        - {decision: txn_monitoring, action: none}
        - {decision: payment_hold, when: "obs.new_payee and obs.amount > 2000", action: hold}
        - {decision: payment_hold, action: release}
        - {decision: deposit_hold, when: "obs.amount > 5000 or (obs.returns_90d > 0 and obs.amount > 1000)", action: hold}
        - {decision: deposit_hold, action: release}
        - {decision: cash_monitoring, when: "obs.near_threshold_7d >= 2", action: raise_alert}
        - {decision: cash_monitoring, action: none}
        - {decision: payout_hold, when: "obs.amount > 5000 and obs.amount > 5 * obs.usual_payout", action: hold}
        - {decision: payout_hold, action: release}
    analyst_rules:
      kind: rules
      rules:
        - {decision: alert_review, when: "obs.contact_changed_7d and obs.high_risk_logins_7d > 0", action: restrict}
        - {decision: alert_review, action: clear}
    # The second bank's rules: stricter on online purchases and new payees than the first bank's.
    metro_rules:
      kind: rules
      rules:
        - {decision: metro_card_auth, when: "obs.ecommerce and obs.amount > 1000", action: decline}
        - {decision: metro_card_auth, when: "obs.ecommerce and obs.new_device and obs.amount > 200", action: step_up}
        - {decision: metro_card_auth, when: "obs.failed_logins_1d > 2", action: step_up}
        - {decision: metro_card_auth, action: approve}
        - {decision: metro_payment_hold, when: "obs.new_payee and obs.amount > 1000", action: hold}
        - {decision: metro_payment_hold, when: "obs.new_payee and obs.balance_share > 0.8 and obs.amount > 300", action: hold}
        - {decision: metro_payment_hold, action: release}
    aml_rules:
      kind: rules
      rules:
        - {decision: aml_review, when: "obs.near_threshold_30d >= 3", action: file_sar}
        - {decision: aml_review, action: clear}
    ato_script:
      kind: scripted
      script:
        ato_route:
          cheap: "1 - params.ato_stealth_route"
          stealth: params.ato_stealth_route
        ato_takeover:
          change_email: "1"
        ato_cash_out:
          medium: "(1 - params.ato_blend) * (1 - params.ato_drain)"
          blend: "params.ato_blend * (1 - params.ato_drain)"
          drain: params.ato_drain
        ato_after_decline:
          retry_lower: "0.6 if obs.amount > 50 else 0.1"
          wait: "0.4 if obs.amount > 50 else 0.9"

  decisions:
    card_auth:
      role: defender
      at: {event: card_purchase}
      actions: [approve, decline, step_up]
      default_action: approve
      timeout: 50ms
      observation: auth_view
    login_check:
      role: defender
      at: {event: login}
      actions: [allow, step_up, block]
      default_action: allow
      timeout: 50ms
      observation: login_view
    txn_monitoring:
      role: defender
      at: {event: card_purchase, outcome: approve, after: true}
      actions:
        none: []
        raise_alert:
          - create: {entity: alert, attributes: {subject: card.holder, reason: "'txn_monitoring'"}}
      default_action: none
      observation: auth_view
    payment_hold:
      role: defender
      at: {event: p2p_send}
      actions: [release, hold, block]
      default_action: release
      observation: p2p_view
    metro_card_auth:
      role: metro_defender
      at: {event: card_purchase, where: "card.account.institution == institution('metro_bank')"}
      actions: [approve, decline, step_up]
      default_action: approve
      timeout: 50ms
      observation: metro_auth_view
    metro_payment_hold:
      role: metro_defender
      at: {event: p2p_send, where: "account.institution == institution('metro_bank')"}
      actions: [release, hold, block]
      default_action: release
      observation: metro_p2p_view
    deposit_hold:
      role: defender
      at: {event: check_deposit}
      actions: [release, hold, reject]
      default_action: release
      observation: deposit_view
    cash_monitoring:
      role: defender
      at: {event: cash_deposit, outcome: ok, after: true}
      actions:
        none: []
        raise_alert:
          - create: {entity: aml_alert, attributes: {subject: account.holder, reason: "'cash_near_threshold'"}}
      default_action: none
      observation: cash_view
    payout_hold:
      role: defender
      at: {event: business_payout}
      actions: [release, hold]
      default_action: release
      observation: payout_view
    aml_review:
      role: aml_analyst
      at: {machine: aml_case, state: in_review}
      actions: [clear, file_sar, close_account]
      default_action: clear
      observation: aml_investigation
    alert_review:
      role: analyst
      at: {machine: alert_case, state: in_review}
      actions: [clear, restrict, close_account, file_sar]
      default_action: clear
      observation: investigation
    ato_route:
      role: adversary
      at: {scenario: account_takeover, state: prepare}
      actions: [cheap, stealth]
      default_action: cheap
      observation: ato_route_view
    ato_takeover:
      role: adversary
      at: {scenario: account_takeover, state: takeover}
      actions: [change_email, keep_contact]
      default_action: change_email
      observation: ato_takeover_view
    ato_cash_out:
      role: adversary
      at: {scenario: account_takeover, state: plan}
      actions: [small, medium, large, blend, drain, stop]
      default_action: medium
      observation: ato_plan_view
    ato_after_decline:
      role: adversary
      at: {event: card_purchase, outcome: decline, after: true, where: "cause.scenario == 'account_takeover'"}
      actions:
        retry_lower:
          - emit:
              event: card_purchase
              actor: event.actor
              after: {m: {p50: 5, p95: 30}}
              fields:
                card: event.card
                merchant: event.merchant
                amount: "round(event.amount * 0.5, 2)"
                channel: event.channel
                device: event.device
                ip: event.ip
        wait: []
      default_action: retry_lower
      # Without a floor, a learned fraudster retried each declined purchase about 1,300 times an episode (R7).
      available: {retry_lower: "obs.amount >= 20"}
      observation: adversary_view

  observations:
    auth_view:
      observer: demo_bank
      subject: event.card.holder
      window: 90d
      features: &auth_features
        amount: event.amount
        ecommerce: "event.channel == 'ecommerce'"
        new_device: "event.device != none and count(subject.history('login', '90d'), where=it.device == event.device) == 0"
        txn_count_7d: "count(subject.history('card_purchase', '7d'))"
        contact_changed_7d: "count(subject.history('profile_change', '7d')) > 0"
        failed_logins_1d: "count(subject.history('login', '1d'), where=it.outcome == 'failed')"
        ip_risk: event.ip_risk
      tables: [CARD_TXN, LOGIN_EVT]
    login_view:
      observer: demo_bank
      subject: event.person
      window: 90d
      features:
        device_risk: event.device_risk
        ip_risk: event.ip_risk
        known_device: "count(subject.history('login', '90d'), where=it.device == event.device and it.outcome == 'allow') > 0"
        failed_logins_1d: "count(subject.history('login', '1d'), where=it.outcome == 'failed')"
    investigation:
      observer: demo_bank
      subject: entity.subject
      window: 180d
      features:
        contact_changed_7d: "count(subject.history('profile_change', '7d')) > 0"
        high_risk_logins_7d: "count(subject.history('login', '7d'), where=it.ip_risk > 0.7)"
      tables: [CUSTOMER, CARD_TXN, LOGIN_EVT]
      tools:
        sql: {cost_minutes: 2, max_rows: 500, timeout: 5s}
        lookup: {cost_minutes: 1}
        declared: [recent_card_txns, step_up, call_customer]
      max_turns: 30
      budget_minutes: 45
    p2p_view:
      observer: demo_bank
      subject: event.account.holder
      window: 90d
      features: &p2p_features
        amount: event.amount
        new_payee: "count(subject.history('p2p_send', '90d'), where=it.payee == event.payee) == 0"
        balance_share: "event.amount / (event.account.balance + 1)"
        age: subject.age
        sends_7d: "count(subject.history('p2p_send', '7d'))"
      tables: [P2P_TXN]
    # The second bank's views: the same features, from its own tables.
    metro_auth_view:
      observer: metro_bank
      subject: event.card.holder
      window: 90d
      features: *auth_features
      tables: [CARD_TXN, LOGIN_EVT]
    metro_p2p_view:
      observer: metro_bank
      subject: event.account.holder
      window: 90d
      features: *p2p_features
      tables: [P2P_TXN]
    deposit_view:
      observer: demo_bank
      subject: event.account.holder
      window: 90d
      features:
        amount: event.amount
        mobile: "event.channel == 'mobile'"
        balance: event.account.balance
        deposits_30d: "count(subject.history('check_deposit', '30d'))"
        returns_90d: "count(subject.history('check_return', '90d'))"
      tables: [CHECK_TXN, ACCOUNT]
    cash_view:
      observer: demo_bank
      subject: event.account.holder
      window: 30d
      features:
        amount: event.amount
        near_threshold_7d: "count(subject.history('cash_deposit', '7d'), where=it.amount >= 8000 and it.amount < 10000)"
        cash_7d: "sum(subject.history('cash_deposit', '7d'), it.amount)"
    payout_view:
      observer: demo_bank
      subject: event.business.owner
      window: 90d
      features:
        amount: event.amount
        owner_draw: "event.kind == 'owner_draw'"
        usual_payout: "coalesce(mean(subject.history('business_payout', '90d'), it.amount), event.amount)"
        sales_7d: "sum(subject.history('card_settlement', '7d'), it.amount)"
      tables: [BUSINESS_TXN]
    aml_investigation:
      observer: demo_bank
      subject: entity.subject
      window: 180d
      features:
        near_threshold_30d: "count(subject.history('cash_deposit', '30d'), where=it.amount >= 8000 and it.amount < 10000)"
        cash_30d: "sum(subject.history('cash_deposit', '30d'), it.amount)"
        wires_30d: "count(subject.history('wire_out', '30d'))"
      tables: [CUSTOMER, ACCOUNT, CASH_DEPOSIT, CASH_WITHDRAWAL, WIRE_TXN, P2P_TXN, TRANSFER_TXN]
    adversary_view:
      subject: event.actor
      window: 7d
      features:
        amount: event.amount
    ato_route_view:
      description: What the fraudster knows of the victim before the attack.
      subject: entity.victim
      window: 7d
      features:
        victim_age: subject.age
    ato_takeover_view:
      description: >-
        The fraudster's own view of the victim. As an own view, its histories hold only the fraudster's events;
        `it.actor == entity.fraudster` says so in the expressions too.
      subject: entity.victim
      window: 7d
      features:
        failed_logins_7d: "count(subject.history('login', '7d'), where=it.actor == entity.fraudster and it.outcome == 'failed')"
    ato_plan_view:
      description: The fraudster's own view at each cash-out, as in `ato_takeover_view`.
      subject: entity.victim
      window: 7d
      features:
        hijacked: "count(subject.history('profile_change', '7d'), where=it.actor == entity.fraudster) > 0"
        approved_1d: "count(subject.history('card_purchase', '1d'), where=it.actor == entity.fraudster and it.outcome == 'approve')"
        refused_1d: "count(subject.history('card_purchase', '1d'), where=it.actor == entity.fraudster and it.outcome in ('decline', 'step_up'))"
        days_in: days_since(entity.created_at)

  # The analyst's tools beyond `sql` and `lookup` (SPEC §8.7).
  tools:
    recent_card_txns:
      description: The customer's card authorizations in the last `days` days, newest first.
      args:
        customer: {type: ref, entity: person}
        days: {type: int, min: 1, max: 90, default: 30}
      sql: >
        SELECT AUTH_ID, AUTH_TS, AMT, MCC_CAT, CHANNEL, IP_RISK, RESP_CD FROM CARD_TXN
        WHERE CUST_ID = $customer AND date_part('epoch', $as_of) - date_part('epoch', AUTH_TS) < $days * 86400
        ORDER BY AUTH_TS DESC
      max_rows: 200
      cost_minutes: 1
    step_up:
      description: Ask for a one-time code, sent to the customer's phone, at each of the customer's online card
        payments.
      args:
        customer: {type: ref, entity: person}
      emit: {event: step_up_requested, fields: {person: args.customer}}
      cost_minutes: 2
    call_customer:
      description: Phone the customer on the number on file and ask whether they made their recent card payments.
      args:
        customer: {type: ref, entity: person}
      emit: {event: customer_call, fields: {person: args.customer}}
      reply: {event: call_answer, within: 30m}
      cost_minutes: 5
      max_calls: 2

  rewards:
    # Each task's fraud loss counts what its decision can stop: the card task a takeover's card purchases, the P2P task
    # a scam's payments and a takeover's drain by P2P.
    auth_reward:
      terms:
        # Fraud Arena 1v1: every takeover loss counts, P2P drains included, since the defender also gates P2P sends.
        fraud_loss:
          kind: money
          value: transfer.amount
          where: >-
            transfer.cause.scenario in ('account_takeover', 'card_testing')
            and transfer.payer.institution == institution('demo_bank')
          weight: -1.0
        p2p_friction:
          description: A legitimate P2P payment that the bank holds or blocks (as in p2p_reward).
          kind: count
          event: p2p_send
          outcome: [hold, block]
          where: "cause.label != 'fraud'"
          value: -4
        friction:
          description: A legitimate purchase that the bank declines.
          kind: count
          event: card_purchase
          outcome: [decline]
          where: "cause.label != 'fraud'"
          value: -2.5
        step_ups:
          description: >-
            A legitimate purchase that the bank steps up: one SMS code ($0.0118 to $0.0133 with carrier fees, Twilio's US
            price list, October 2026), and the interchange lost when the customer abandons the challenge (21 cents plus
            0.05% plus 1 cent under Regulation II, $0.24 on the mean purchase, times 10% to 14% of challenges abandoned:
            the EPA's SCA white paper and Microsoft's tests as Riskified reports them). About $0.045; $0.05.
          kind: count
          event: card_purchase
          outcome: [step_up]
          where: "cause.label != 'fraud'"
          value: -0.05
        attrition:
          kind: count
          event: account_closed
          where: "event.reason == 'friction'"
          value: -120
      scope: subject
      horizon: 30d
      settle: oracle
      baseline: {kind: none}
    # The second bank's tasks count its own losses.
    metro_auth_reward:
      terms:
        fraud_loss:
          kind: money
          value: transfer.amount
          where: >-
            transfer.cause.scenario in ('account_takeover', 'card_testing') and transfer.payee != external('p2p_network')
            and transfer.payer.institution == institution('metro_bank')
          weight: -1.0
        friction:
          description: A legitimate purchase that the bank declines.
          kind: count
          event: card_purchase
          outcome: [decline]
          where: "cause.label != 'fraud'"
          value: -2.5
        step_ups:
          description: >-
            A legitimate purchase that the bank steps up: one SMS code ($0.0118 to $0.0133 with carrier fees, Twilio's US
            price list, October 2026), and the interchange lost when the customer abandons the challenge (21 cents plus
            0.05% plus 1 cent under Regulation II, $0.24 on the mean purchase, times 10% to 14% of challenges abandoned:
            the EPA's SCA white paper and Microsoft's tests as Riskified reports them). About $0.045; $0.05.
          kind: count
          event: card_purchase
          outcome: [step_up]
          where: "cause.label != 'fraud'"
          value: -0.05
        attrition:
          kind: count
          event: account_closed
          where: "event.reason == 'friction'"
          value: -120
      scope: subject
      horizon: 30d
      settle: oracle
      baseline: {kind: none}
    metro_p2p_reward:
      terms:
        fraud_loss:
          kind: money
          value: transfer.amount
          where: >-
            transfer.cause.scenario in ('app_scam', 'account_takeover', 'elder_abuse', 'check_fraud', 'synthetic_bust_out')
            and transfer.payee == external('p2p_network')
            and transfer.payer.institution == institution('metro_bank')
          weight: -1.0
        friction:
          kind: count
          event: p2p_send
          outcome: [hold, block]
          where: "cause.label != 'fraud'"
          value: -4
      scope: subject
      horizon: 30d
      settle: oracle
    review_reward:
      terms:
        review_outcome:
          kind: outcome
          decision: alert_review
          truth: "has_label(subject, 'account_takeover')"
          table:
            clear: {true: -100, false: 3}
            restrict: {true: 40, false: -15}
            close_account: {true: 30, false: -60}
            file_sar: {true: 50, false: -10}
        analyst_time: {kind: cost, of: tool_minutes, rate: -0.5}
        later_fraud_loss:
          kind: money
          value: transfer.amount
          where: "transfer.cause.label == 'fraud'"
          weight: -1.0
      scope: subject
      horizon: 30d
      settle: knowable
    p2p_reward:
      terms:
        fraud_loss:
          kind: money
          value: transfer.amount
          where: >-
            transfer.cause.scenario in ('app_scam', 'account_takeover', 'elder_abuse', 'check_fraud', 'synthetic_bust_out')
            and transfer.payee == external('p2p_network')
            and transfer.payer.institution == institution('demo_bank')
          weight: -1.0
        friction:
          kind: count
          event: p2p_send
          outcome: [hold, block]
          where: "cause.label != 'fraud'"
          value: -4
      scope: subject
      horizon: 30d
      settle: oracle
    adversary_reward:
      terms:
        fraud_gain: {kind: money, value: transfer.amount, where: "transfer.cause.scenario == 'account_takeover'", weight: 1.0}
        stealth_logins:
          description: What a login through the stealth route costs the fraudster.
          kind: count
          event: login
          where: "cause.label == 'fraud' and event.ip.kind == 'residential_proxy'"
          value: -3
        stealth_purchases:
          description: What a purchase through the stealth route costs the fraudster.
          kind: count
          event: card_purchase
          where: "cause.label == 'fraud' and event.ip != none and event.ip.kind == 'residential_proxy'"
          value: -15
        shop_purchases:
          description: What the fraudster pays a mule for each purchase in a shop.
          kind: count
          event: card_purchase
          where: "cause.label == 'fraud' and event.channel == 'card_present'"
          value: -20
        stealth_payments:
          description: What a P2P payment through the stealth route costs the fraudster.
          kind: count
          event: p2p_send
          where: "cause.scenario == 'account_takeover' and event.ip.kind == 'residential_proxy'"
          value: -15
      horizon: 30d

  episodes:
    auth_30d:
      shape: fast
      external: [defender]
      decisions: [card_auth]
      unit: person
      start:
        warmup: 180d
        where: "count(self.cards, where=it.status == 'active' and it.account.institution == institution('demo_bank')) > 0"
        oversample: [{scenario: account_takeover, share: 0.3}]
      horizon: 30d
      end_when: "self.status == 'closed'"
      fork: local
      reward: auth_reward
      max_decisions: 2000
    review_alert:
      shape: agentic
      external: [analyst]
      decisions: [alert_review]
      unit: decision
      start: {at_decision: alert_review, warmup: 180d}
      horizon: 30d
      fork: full
      reward: review_reward
      clock: moves
    auth_vs_adversary:
      shape: fast
      external: [defender, adversary]
      decisions: [card_auth, payment_hold, ato_route, ato_takeover, ato_cash_out, ato_after_decline]
      unit: person
      start:
        warmup: 180d
        where: "count(self.cards, where=it.status == 'active' and it.account.institution == institution('demo_bank')) > 0"
        oversample: [{scenario: account_takeover, share: 1.0}]
      horizon: 30d
      fork: local
      reward: {defender: auth_reward, adversary: adversary_reward}

    p2p_30d:
      shape: fast
      external: [defender]
      decisions: [payment_hold]
      unit: person
      start:
        warmup: 180d
        where: "count(self.accounts, where=it.type == 'checking' and it.institution == institution('demo_bank')) > 0"
        oversample: [{scenario: app_scam, share: 0.3}]
      horizon: 30d
      fork: local
      reward: p2p_reward
      max_decisions: 2000

    # The same two tasks with a family that their training doesn't see (payments-fast v3): card testing in place of
    # takeovers, and elder abuse in place of scams.
    auth_30d_card_testing:
      shape: fast
      external: [defender]
      decisions: [card_auth]
      unit: person
      start:
        warmup: 180d
        where: "count(self.cards, where=it.status == 'active' and it.account.institution == institution('demo_bank')) > 0"
        oversample: [{scenario: card_testing, share: 0.3}]
      horizon: 30d
      end_when: "self.status == 'closed'"
      fork: local
      reward: auth_reward
      max_decisions: 2000
    p2p_30d_elder_abuse:
      shape: fast
      external: [defender]
      decisions: [payment_hold]
      unit: person
      start:
        warmup: 180d
        where: "count(self.accounts, where=it.type == 'checking' and it.institution == institution('demo_bank')) > 0"
        oversample: [{scenario: elder_abuse, share: 0.3}]
      horizon: 30d
      fork: local
      reward: p2p_reward
      max_decisions: 2000

    # The same two tasks at the second bank, for a split by institution.
    metro_auth_30d:
      shape: fast
      external: [metro_defender]
      decisions: [metro_card_auth]
      unit: person
      start:
        warmup: 180d
        where: "count(self.cards, where=it.status == 'active' and it.account.institution == institution('metro_bank')) > 0"
        oversample: [{scenario: account_takeover, share: 0.3}]
      horizon: 30d
      end_when: "self.status == 'closed'"
      fork: local
      reward: metro_auth_reward
      max_decisions: 2000
    metro_p2p_30d:
      shape: fast
      external: [metro_defender]
      decisions: [metro_payment_hold]
      unit: person
      start:
        warmup: 180d
        where: "count(self.accounts, where=it.type == 'checking' and it.institution == institution('metro_bank')) > 0"
        oversample: [{scenario: app_scam, share: 0.3}]
      horizon: 30d
      fork: local
      reward: metro_p2p_reward
      max_decisions: 2000

splits:
  train: {seeds: "0-799", institutions: [demo_bank]}
  validation: {seeds: "800-899"}
  test: {seeds: "900-999"}

calibration:
  targets:
    # Public targets (R6). Each one's notes say where the public statistic and the world's query differ.
    - name: debit_payments_per_customer_month
      observer: demo_bank
      statistic:
        kind: mean
        sql: "SELECT count(*) / 12.0 / (SELECT count(*) FROM CUSTOMER) FROM CARD_TXN WHERE RESP_CD = '00'"
      value: 14.7
      tolerance: 1.5
      weight: 2
      evidence:
        method: documented
        source: >-
          Federal Reserve Financial Services, 2026 Findings from the Diary of Consumer Payment Choice (O'Brien and
          Phelps, May 2026), footnote 6
        as_of: "2025-10"
        confidence: medium
        notes: >-
          Mean debit card payments per U.S. adult per month: 14.70 in October 2025, from 6,079 diarists weighted to
          the Current Population Survey, bills and person-to-person payments included. Here: approved authorizations
          on the bank's cards per customer of the bank, which assumes its customers make their debit payments on its
          cards.
    - name: remote_card_share
      observer: demo_bank
      statistic:
        kind: share
        sql: "SELECT avg(CASE WHEN CHANNEL = 'ecommerce' THEN 1.0 ELSE 0.0 END) FROM CARD_TXN WHERE RESP_CD = '00'"
      value: 0.362
      tolerance: 0.04
      weight: 1
      evidence:
        method: documented
        source: >-
          Federal Reserve Board, National Payment Volumes, Detailed Data, NPIPS (CY 2021 and 2022), Federal Reserve
          Payments Study, released November 2024
        as_of: "2022"
        confidence: medium
        notes: >-
          In-person payments were 63.8% of general-purpose card payments by number in 2022, so remote payments were
          36.2%. Those cards are credit, non-prepaid and prepaid debit; the bank's cards here are debit cards.
    - name: mean_debit_payment
      observer: demo_bank
      statistic: {kind: mean, sql: "SELECT avg(AMT) FROM CARD_TXN WHERE RESP_CD = '00'"}
      value: 44.78
      tolerance: 5
      weight: 1
      evidence:
        method: inferred
        source: >-
          Federal Reserve Board, 2024 Accessible Version of Trends in Noncash Payments, Federal Reserve Payments Study
        as_of: "2022"
        confidence: medium
        notes: >-
          89.1 billion non-prepaid debit card payments worth $3.99 trillion in 2022, so $44.78 each on average.
          Business debit cards are in those totals; the bank's cards here are consumer cards.
    - name: logins_per_customer_month
      observer: demo_bank
      statistic:
        kind: quantiles
        sql: "SELECT CUST_ID, count(*) / 12.0 AS per_month FROM LOGIN_EVT GROUP BY CUST_ID"
      value: {p10: 1, p50: 6, p90: 20}
      tolerance: 0.15
      weight: 1
      evidence: {method: assumed}
    - name: card_decline_share
      observer: demo_bank
      statistic: {kind: share, sql: "SELECT avg(CASE WHEN RESP_CD <> '00' THEN 1.0 ELSE 0.0 END) FROM CARD_TXN"}
      value: 0.04
      tolerance: 0.01
      weight: 2
      evidence: {method: assumed}
  method: {optimizer: cma_es, budget: 300, seeds: 4, world_size: {household: 500}, window: 365d}

checks:
  - {id: fidelity, kind: config_fidelity}
  - {id: ledger, kind: ledger_reconciles}
  - {id: no_as_of_leak, kind: as_of_leak, observations: [auth_view, login_view, investigation]}
  - {id: no_single_column_ato, kind: single_feature_shortcut, label: account_takeover, observer: demo_bank, max_auc: 0.75}
  - {id: ato_not_trivial, kind: too_easy, scenario: account_takeover, detector: single_rule, max_recall: 0.6}
  - {id: ato_window_edges, kind: window_edge, label: account_takeover, edge: 14d, max_ratio: 1.5}
  - {id: no_single_column_scam, kind: single_feature_shortcut, label: app_scam, observer: demo_bank, max_auc: 0.75}
  - {id: scam_not_trivial, kind: too_easy, scenario: app_scam, detector: single_rule, max_recall: 0.6}
  - {id: no_single_column_mule, kind: single_feature_shortcut, label: money_mule, observer: demo_bank, max_auc: 0.75}
  - {id: mule_not_trivial, kind: too_easy, scenario: money_mule, detector: single_rule, max_recall: 0.6}
  - {id: no_single_column_card, kind: single_feature_shortcut, label: card_compromise, observer: demo_bank, max_auc: 0.75}
  - {id: card_not_trivial, kind: too_easy, scenario: card_testing, detector: single_rule, max_recall: 0.6}
  - {id: no_single_column_synthetic, kind: single_feature_shortcut, label: synthetic_identity, observer: demo_bank, max_auc: 0.75}
  - {id: synthetic_not_trivial, kind: too_easy, scenario: synthetic_bust_out, detector: single_rule, max_recall: 0.6}
  - {id: no_single_column_check, kind: single_feature_shortcut, label: check_fraud, observer: demo_bank, max_auc: 0.75}
  - {id: check_not_trivial, kind: too_easy, scenario: check_fraud, detector: single_rule, max_recall: 0.6}
  - {id: no_single_column_chargeback, kind: single_feature_shortcut, label: false_chargeback, observer: demo_bank, max_auc: 0.75}
  - {id: chargeback_not_trivial, kind: too_easy, scenario: false_chargeback, detector: single_rule, max_recall: 0.6}
  - {id: no_single_column_structuring, kind: single_feature_shortcut, label: structuring, observer: demo_bank, max_auc: 0.75}
  - {id: structuring_not_trivial, kind: too_easy, scenario: structuring, detector: single_rule, max_recall: 0.6}
  - {id: no_single_column_merchant, kind: single_feature_shortcut, label: merchant_bust_out, observer: demo_bank, max_auc: 0.75}
  - {id: merchant_not_trivial, kind: too_easy, scenario: merchant_bust_out, detector: single_rule, max_recall: 0.6}
  # Victims are 60 or older by definition: age says who can be one, so it doesn't count as a shortcut.
  - {id: no_single_column_elder, kind: single_feature_shortcut, label: elder_abuse, observer: demo_bank, max_auc: 0.75,
     given: [CUSTOMER.AGE]}
  - {id: elder_not_trivial, kind: too_easy, scenario: elder_abuse, detector: single_rule, max_recall: 0.6}
  - {id: no_single_column_laundering, kind: single_feature_shortcut, label: laundering, observer: demo_bank, max_auc: 0.75}
  - {id: laundering_not_trivial, kind: too_easy, scenario: laundering, detector: single_rule, max_recall: 0.6}
  # The second bank sees the other side of the scams that pay world mules.
  - {id: no_single_column_mule_metro, kind: single_feature_shortcut, label: money_mule, observer: metro_bank, max_auc: 0.75}
  - {id: no_single_column_scam_metro, kind: single_feature_shortcut, label: app_scam, observer: metro_bank, max_auc: 0.75}
  - {id: targets_fit, kind: target_fit}
  - id: logins_load_after_event
    kind: constraint_holds
    observer: demo_bank
    sql: "SELECT avg(CASE WHEN LOAD_TS >= LOGIN_TS THEN 1.0 ELSE 0.0 END) FROM LOGIN_EVT"
    min_share: 1.0
  - {id: customer_realism, kind: classifier, observer: demo_bank, unit: person, window: 90d, max_auc: 0.6}
  - {id: auth_reward_bounds, kind: reward_bounds, episode: auth_30d}
  - {id: p2p_reward_bounds, kind: reward_bounds, episode: p2p_30d}
  - {id: metro_auth_reward_bounds, kind: reward_bounds, episode: metro_auth_30d}
  - {id: metro_p2p_reward_bounds, kind: reward_bounds, episode: metro_p2p_30d}
  - {id: auth_generalizes, kind: generalization_gap, episode: auth_30d, train: train, test: test, max_gap: 0.1}
